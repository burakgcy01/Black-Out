<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>AeroGrid: Void Survival</title><style>*{box-sizing:border-box}body,html{margin:0;padding:0;width:100%;height:100%;background:#050508;overflow:hidden;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;color:#e0e0e0;user-select:none;touch-action:none}canvas{display:block}@import url("https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Orbitron:wght@700;900&display=swap");#bars-container{position:absolute;top:15px;left:15px;display:flex;flex-direction:row;align-items:flex-start;gap:10px;pointer-events:none}.bar-group{display:flex;flex-direction:column;align-items:center;gap:6px}.bar-emoji{font-size:20px}.bar-track{width:18px;height:140px;background:rgba(0,0,0,.4);border-radius:9px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}#energy-bar-track{border:1px solid rgba(168,85,247,.4)}#energyBar{width:100%;height:100%;background:linear-gradient(0deg,#6d28d9,#a855f7,#e879f9);transition:height .2s ease;box-shadow:0 0 12px rgba(168,85,247,.7),0 0 24px rgba(168,85,247,.3);border-radius:9px}#resources-panel{position:absolute;top:15px;right:15px;background:linear-gradient(135deg,rgba(10,5,25,.95),rgba(20,10,45,.9));border:1.5px solid rgba(168,85,247,.7);padding:10px 14px;border-radius:18px;backdrop-filter:blur(16px);pointer-events:auto;box-shadow:0 0 0 1px rgba(168,85,247,.15),0 8px 32px rgba(80,0,150,.4),inset 0 1px 0 rgba(255,255,255,.06);display:flex;flex-direction:column;align-items:flex-end;width:80px;overflow:visible;z-index:10}.resource-item{display:flex;align-items:center;font-size:22px;font-weight:700;color:#c084fc;gap:6px}#coordinates-panel{margin-top:6px;pointer-events:none;font-size:18px;font-weight:700;color:#e0aaff;text-align:right;white-space:nowrap}.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;z-index:1000;pointer-events:none}.modal-overlay.active{display:flex;pointer-events:auto}.modal{background:linear-gradient(145deg,rgba(8,4,22,.98),rgba(20,10,45,.97));border:1.5px solid rgba(168,85,247,.6);border-radius:22px;padding:30px;max-width:520px;width:90%;max-height:85vh;overflow-y:auto;box-shadow:0 0 0 1px rgba(168,85,247,.1),0 20px 60px rgba(70,0,150,.6),inset 0 1px 0 rgba(255,255,255,.05);position:relative}.moda l-header{font-size:22px;color:#a855f7;margin-bottom:18px ;text-align:center;text-transform:uppercase;letter-spacing:3px;font-weight:700}.close-btn{position:absolute;top:15px;right:15px;background:rgba(239,68,68,.2);border:2px solid #ef4444;color:#ef4444;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px;transition:all .2s}.close-btn:hover{background:rgba(239,68,68,.4);transform:scale(1.1)}#recipes-container{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.recipe{background:linear-gradient(145deg,rgba(20,15,40,.8),rgba(30,20,55,.7));border:1px solid rgba(168,85,247,.25);border-radius:12px;padding:10px 8px;cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);margin-bottom:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}.recipe:hover{border-color:#a855f7;transform:translateY(-2px);box-shadow:0 6px 20px rgba(168,85,247,.3)}.recipe.disabled{opacity:.4;cursor:not-allowed}.recipe.disabled:hover{transform:none;border-color:rgba(168,85,247,.3);box-shadow:none}.recipe-title{font-size:14px;font-weight:700;color:#c084fc;margin-bottom:4px}.recipe-requirements{font-size:12px;color:#9ca3af}#grid-placement-info{position:absolute;bottom:200px;left:50%;transform:translateX(-50%);background:rgba(168,85,247,.95);color:#000;padding:15px 30px;border-radius:12px;font-weight:700;font-size:16px;display:none;pointer-events:none;box-shadow:0 4px 20px rgba(168,85,247,.6);z-index:50}#controls{position:absolute;bottom:0;left:0;width:100%;height:50%;pointer-events:none;z-index:10}.game-btn{position:absolute;background:radial-gradient(circle,rgba(168,85,247,.25),rgba(80,0,150,.15));border:2px solid rgba(168,85,247,.8);border-radius:50%;color:#d8b4fe;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;pointer-events:auto;cursor:pointer;backdrop-filter:blur(12px);transition:all .15s cubic-bezier(.4,0,.2,1);box-shadow:0 0 0 1px rgba(168,85,247,.2),0 0 20px rgba(168,85,247,.4),inset 0 1px 0 rgba(255,255,255,.1);z-index:10}.game-btn:active{background:rgba(168,85,247,.5);transform:scale(.95)}#jump-btn{bottom:40px;right:40px;width:78px;height:78px;font-size:26px;background:radial-gradient(circle,rgba(168,85,247,.3),rgba(109,40,217,.15))!important;box-shadow:0 0 0 2px rgba(168,85,247,.3),0 0 30px rgba(168,85,247,.5),inset 0 0 20px rgba(168,85,247,.1)!important}#craft-btn{width:44px;height:44px;font-size:22px}#attack-btn{bottom:125px;right:40px;width:68px;height:68px;font-size:20px;border-color:rgba(239,68,68,.9);color:#fca5a5;background:radial-gradient(circle,rgba(239,68,68,.25),rgba(127,29,29,.15));box-shadow:0 0 0 1px rgba(239,68,68,.2),0 0 24px rgba(239,68,68,.5),inset 0 1px 0 rgba(255,200,200,.1)}#attack-btn:active{background:rgba(239,68,68,.45)}#switch-weapon-btn{bottom:200px;right:55px;width:36px;height:36px;font-size:16px;border-color:#a855f7;color:#a855f7;background:rgba(168,85,247,.15);box-shadow:0 0 12px rgba(168,85,247,.3)}#switch-weapon-btn:active{background:rgba(168,85,247,.4)}#food-btn{bottom:100px;left:50%;transform:translateX(-50%) translateX(20px);width:52px;height:52px;font-size:22px;border-color:#22c55e;color:#22c55e;background:rgba(34,197,94,.15);box-shadow:0 0 14px rgba(34,197,94,.3)}#food-btn:active{background:rgba(34,197,94,.4)}#joystick-base{position:fixed;left:110px;bottom:110px;width:114px;height:114px;background:radial-gradient(circle,rgba(168,85,247,.08),rgba(80,0,150,.04));border:2px solid rgba(168,85,247,.35);border-radius:50%;pointer-events:none;transform:translate(-50%,50%);z-index:10;box-shadow:0 0 0 1px rgba(168,85,247,.1),0 0 30px rgba(168,85,247,.15)}#joystick-stick{position:fixed;left:110px;bottom:110px;width:46px;height:46px;background:radial-gradient(circle at 35% 35%,#d8b4fe,#a855f7,#7e22ce);border:2px solid rgba(196,132,252,.9);border-radius:50%;pointer-events:none;transform:translate(-50%,50%);box-shadow:0 0 0 1px rgba(168,85,247,.3),0 0 24px rgba(168,85,247,.8),inset 0 2px 0 rgba(255,255,255,.2);z-index:11}.notification{position:absolute;top:120px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,rgba(109,40,217,.97),rgba(168,85,247,.95));color:#f5f3ff;padding:12px 24px;border-radius:14px;font-weight:700;font-size:14px;pointer-events:none;opacity:0;transition:opacity .3s;box-shadow:0 0 0 1px rgba(196,132,252,.4),0 6px 28px rgba(109,40,217,.6);z-index:100;border:1px solid rgba(196,132,252,.5);letter-spacing:.3px}.notification.show{opacity:1}#chest-blocker{position:fixed;top:0;left:0;width:100%;height:100%;z-index:900;display:none}#menu-btn,#inv-btn{position:relative;background:rgba(168,85,247,.2);border:2px solid #a855f7;border-radius:12px;color:#c084fc;font-weight:700;cursor:pointer;pointer-events:auto;backdrop-filter:blur(8px);box-shadow:0 0 14px rgba(168,85,247,.4);transition:all .2s}#menu-btn{font-size:18px;padding:6px 12px}#inv-btn{font-size:16px;padding:6px 10px}#menu-btn:hover,#inv-btn:hover{background:rgba(168,85,247,.4)}#world-select-modal .world-option{background:rgba(30,35,55,.6);border:2px solid rgba(168,85,247,.3);border-radius:12px;padding:20px;margin-bottom:12px;cursor:pointer;transition:all .3s}#world-select-modal .world-option:hover{border-color:#a855f7;transform:translateY(-2px);box-shadow:0 6px 20px rgba(168,85,247,.3)}#world-select-modal .world-option.active{border-color:#a855f7;background:rgba(168,85,247,.15)}#world-select-modal .world-name{font-size:18px;font-weight:700;color:#c084fc;margin-bottom:6px}#world-select-modal .world-desc{font-size:13px;color:#9ca3af}#duel-result{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at center,rgba(30,0,60,.95),rgba(0,0,0,.98));display:none;align-items:center;justify-content:center;z-index:2000;flex-direction:column;gap:20px;backdrop-filter:blur(8px)}#duel-result.show{display:flex}#duel-result-text{font-size:52px;font-weight:900;text-shadow:0 0 40px currentColor}#duel-result-sub{font-size:18px;color:#9ca3af}#duel-result-btn{background:rgba(168,85,247,.3);border:2px solid #a855f7;color:#c084fc;font-size:18px;font-weight:700;padding:14px 36px;border-radius:14px;cursor:pointer;transition:all .2s}#duel-result-btn:hover{background:rgba(168,85,247,.5)}.inv-slot{background:rgba(30,35,55,.7);border:2px solid rgba(168,85,247,.3);border-radius:12px;padding:12px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px}.inv-slot-icon{font-size:28px;min-width:36px;text-align:center}.inv-slot-info{flex:1}.inv-slot-name{font-size:15px;font-weight:700;color:#c084fc}.inv-slot-count{font-size:13px;color:#9ca3af;margin-top:2px}.inv-slot-qty{font-size:22px;font-weight:900;color:#fbbf24;min-width:40px;text-align:right}</style></head><body><div id="world-item-layer" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5;overflow:hidden;"></div><div id="bars-container"><div class="bar-group"><div class="bar-emoji">🍖</div><div class="bar-track" id="energy-bar-track"><div id="energyBar"></div></div></div></div><div id="resources-panel"><div id="coordinates-panel"><span id="coords-display">(0, 0)</span></div><div style="margin-top:8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;"><div class="game-btn" id="craft-btn" style="position:relative;width:44px;height:44px;font-size:22px;">⚒️</div><button id="inv-btn">🎒</button><button id="menu-btn">☰</button></div></div><div class="notification" id="notification"></div><div id="grid-placement-info">🎯 Gridi yerleştirmek için tıkla (ESC ile iptal)</div><div class="modal-overlay" id="crafting-overlay"><div class="modal"><div class="close-btn" id="close-craft">✕</div><div class="modal-header">🔨 Crafting</div><div id="recipes-container"></div></div></div><div class="modal-overlay" id="world-select-overlay"><div class="modal" id="world-select-modal"><div class="close-btn" id="close-world-select">✕</div><div class="modal-header">🌐 WORLD SEÇ</div><div id="world-options-container"></div></div></div><div id="duel-result"><div id="duel-result-text"></div><div id="duel-result-sub"></div><button id="duel-result-btn">🚪 Lobiye Dön</button></div><div id="joystick-base"></div><div id="joystick-stick"></div><div id="chest-blocker"></div><div id="controls"><div class="game-btn" id="jump-btn">🦘</div><div class="game-btn" id="switch-weapon-btn" title="Silah Değiştir">🔄</div><div class="game-btn" id="food-btn" title="Yemek ye" style="display:none;">🍟</div><div class="game-btn" id="attack-btn">👆</div></div><canvas id="gameCanvas"></canvas><script>const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d'); canvas.width=window.innerWidth; canvas.height=window.innerHeight; window.addEventListener('resize',()=>{canvas.width=window.innerWidth;canvas.height=window.innerHeight;}); if(!CanvasRenderingContext2D.prototype.roundRect){ CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){ this.beginPath();this.moveTo(x+r,y);this.lineTo(x+w-r,y);this.quadraticCurveTo(x+w,y,x+w,y+r); this.lineTo(x+w,y+h-r);this.quadraticCurveTo(x+w,y+h,x+w-r,y+h); this.lineTo(x+r,y+h);this.quadraticCurveTo(x,y+h,x,y+h-r); this.lineTo(x,y+r);this.quadraticCurveTo(x,y,x+r,y);this.closePath(); }; } let audioCtx=null; function getAudioCtx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx;} function playTone(opts){ try{ const ac=getAudioCtx(); const{type='sine',freq=440,freq2=freq,duration=0.18,volume=0.3,attack=0.005,decay=0.05,sustain=0.4,release=0.1,delay=0,distortion=false}=opts; const osc=ac.createOscillator(),gain=ac.createGain(),now=ac.currentTime+delay; let src=osc; if(distortion){const ws=ac.createWaveShaper(),c=new Float32Array(256);for(let i=0;i<256;i++){const x=(i*2/256)-1;c[i]=x*(Math.abs(x)+0.5)/(1+0.5*x*x);}ws.curve=c;osc.connect(ws);ws.connect(gain);} else osc.connect(gain); gain.connect(ac.destination); osc.type=type;osc.frequency.setValueAtTime(freq,now); if(freq!==freq2)osc.frequency.exponentialRampToValueAtTime(Math.max(0.01,freq2),now+duration); gain.gain.setValueAtTime(0,now);gain.gain.linearRampToValueAtTime(volume,now+attack); gain.gain.linearRampToValueAtTime(volume*sustain,now+attack+decay); gain.gain.setValueAtTime(volume*sustain,now+duration-release);gain.gain.linearRampToValueAtTime(0,now+duration); osc.start(now);osc.stop(now+duration+0.01); }catch(e){} } function playNoise(opts){ try{ const ac=getAudioCtx(); const{duration=0.1,volume=0.2,freq=1200,q=1,delay=0}=opts; const buf=ac.createBuffer(1,Math.floor(ac.sampleRate*duration),ac.sampleRate); const data=buf.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1; const src=ac.createBufferSource(),flt=ac.createBiquadFilter(),gain=ac.createGain(),now=ac.currentTime+delay; src.buffer=buf;flt.type='bandpass';flt.frequency.value=freq;flt.Q.value=q; gain.gain.setValueAtTime(volume,now);gain.gain.exponentialRampToValueAtTime(0.001,now+duration); src.connect(flt);flt.connect(gain);gain.connect(ac.destination);src.start(now);src.stop(now+duration); }catch(e){} } const SFX={ gridStep:()=>{playTone({type:'sine',freq:320,freq2:280,duration:0.08,volume:0.12,attack:0.003,decay:0.02,sustain:0.3,release:0.02});playNoise({duration:0.06,volume:0.08,freq:2400,q:2});}, jump:()=>playTone({type:'sine',freq:220,freq2:440,duration:0.2,volume:0.25,attack:0.01,decay:0.04,sustain:0.5,release:0.1}), land:()=>{playNoise({duration:0.12,volume:0.25,freq:180,q:0.5});playTone({type:'sine',fre
