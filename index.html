// ── Diğer oyuncuları çiz ─────────────────────────────────────────────────────
function drawOtherPlayers() {
    for (const [id, p] of otherPlayers) {
        if (p.currentWorld !== currentWorld) continue;
        if (p.isDead) continue;

        const sx = p.x - camera.x, sy = p.y - camera.y;
        const pz = Math.max(p.z || 0, 0);
        const hScale = Math.max(0.35, 1 + (p.z||0)*0.004);
        const r = 14 * hScale;

        // Gölge
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.ellipse(sx, sy, Math.max(4,r-pz*0.08), Math.max(3,(r-pz*0.08)*0.5), 0, 0, Math.PI*2);
        ctx.fill();

        // Vücut
        const hue = (id * 137) % 360;
        const grad = ctx.createRadialGradient(sx-r*0.3, sy-r*0.3, 0, sx, sy, r);
        grad.addColorStop(0, `hsl(${hue},70%,75%)`);
        grad.addColorStop(1, `hsl(${hue},70%,50%)`);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(sx, sy, r, 0, Math.PI*2);
        ctx.fill();

        // Zırh halkası
        if (p.hasArmor) {
            ctx.save();
            ctx.strokeStyle = `rgba(96,165,250,0.9)`;
            ctx.lineWidth = 3; ctx.shadowColor = '#60a5fa'; ctx.shadowBlur = 16;
            ctx.beginPath(); ctx.arc(sx, sy, r+7, 0, Math.PI*2); ctx.stroke();
            ctx.restore();
        }

        // Ring
        ctx.strokeStyle = `hsl(${hue},70%,60%)`;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(sx, sy, r+2, 0, Math.PI*2); ctx.stroke();

        // Gözler
        const ef = p.facing || 0;
        const px2 = -Math.sin(ef), py2 = Math.cos(ef), fx = Math.cos(ef), fy = Math.sin(ef);
        for (const side of [-1,1]) {
            const ex = sx+fx*r*0.42*0.6+px2*r*0.42*side, ey = sy+fy*r*0.42*0.6+py2*r*0.42*side;
            ctx.fillStyle = 'rgba(230,220,255,0.95)';
            ctx.beginPath(); ctx.arc(ex, ey, r*0.22, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#1a0030';
            ctx.beginPath(); ctx.arc(ex+fx*r*0.11, ey+fy*r*0.11, r*0.11, 0, Math.PI*2); ctx.fill();
        }

        // HP bar
        if (p.health < 100) {
            const bw=44, bh=6, bx=sx-bw/2, by=sy-r-20;
            ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(bx,by,bw,bh);
            ctx.fillStyle=p.health>60?'#22c55e':p.health>30?'#fbbf24':'#ef4444';
            ctx.fillRect(bx,by,bw*(p.health/100),bh);
        }

        // İsim
        ctx.fillStyle = '#e0e0e0';
        ctx.font = 'bold 11px Segoe UI';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText(p.name || `P${id}`, sx, sy - r - 22);

        // Silah göster
        if (p.activeWeaponMode && !p.isEating) {
            ctx.save();
            ctx.translate(sx, sy);
            ctx.rotate(p.facing || 0);
            ctx.scale(hScale, hScale);
            const wm = p.activeWeaponMode;
            if (wm === 'sword') {
                ctx.rotate(-0.7);
                ctx.fillStyle='#78350f'; ctx.fillRect(r*0.6,-1.5,9,3);
                ctx.fillStyle='#d97706'; ctx.fillRect(r*0.6+8,-5,3,10);
                const bs=r*0.6+11;
                ctx.beginPath(); ctx.moveTo(bs,-1.5); ctx.lineTo(bs+28,0); ctx.lineTo(bs,-1.5);
                ctx.fillStyle='#e5e7eb'; ctx.fill();
            } else if (wm === 'gun') {
                ctx.fillStyle='#374151'; ctx.beginPath(); ctx.roundRect(r*0.65,-3,18,6,2); ctx.fill();
                ctx.fillStyle='#60a5fa'; ctx.fillRect(r*0.65+3,-3,1.5,6);
            } else if (wm === 'bow') {
                ctx.strokeStyle='#92400e'; ctx.lineWidth=3;
                ctx.beginPath(); ctx.arc(r*0.75,0,12,-Math.PI*0.55,Math.PI*0.55); ctx.stroke();
            } else if (wm === 'grenade') {
                ctx.fillStyle='#374151';
                ctx.beginPath(); ctx.arc(r*0.65+7,0,6,0,Math.PI*2); ctx.fill();
            }
            ctx.restore();
        }
    }
}

// ── Chat UI ──────────────────────────────────────────────────────────────────
const chatMessages = [];
function showChatMessage(name, text) {
    chatMessages.push({ name, text, t: Date.now() });
    if (chatMessages.length > 8) chatMessages.shift();
}

function drawChat() {
    const now = Date.now();
    const visible = chatMessages.filter(m => now - m.t < 6000);
    if (visible.length === 0) return;
    ctx.save();
    ctx.font = '13px Segoe UI';
    let cy = canvas.height - 180;
    for (const m of visible.slice(-5)) {
        const alpha = Math.min(1, (6000 - (now - m.t)) / 800);
        ctx.globalAlpha = alpha;
        const txt = `${m.name}: ${m.text}`;
        const tw = ctx.measureText(txt).width;
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(8, cy-16, tw+16, 22);
        ctx.fillStyle = '#e0e0e0';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(txt, 16, cy-5);
        cy -= 26;
    }
    ctx.globalAlpha = 1;
    ctx.restore();
}

// ── Çevrimiçi oyuncu sayısı ──────────────────────────────────────────────────
function drawPlayerCount() {
    if (!wsConnected) return;
    ctx.save();
    ctx.font = 'bold 12px Segoe UI';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(8, 8, 130, 22);
    ctx.fillStyle = '#22c55e';
    ctx.fillText(`👥 ${otherPlayers.size+1} oyuncu çevrimiçi`, 14, 12);
    ctx.restore();
}

// ── PvP: projectile başka oyuncuya çarparsa hasar ver ────────────────────────
// update() içindeki projectile loop'una ek kontrol
const _origUpdate = update;
function update() {
    _origUpdate();
    // Başka oyunculara çarpma kontrolü
    for (let i = projectiles.length-1; i >= 0; i--) {
        const p = projectiles[i];
        if (!p || p.fromRemote) continue; // kendi mermimiz değilse atla
        for (const [tid, tp] of otherPlayers) {
            if (tp.currentWorld !== currentWorld) continue;
            if (tp.isDead) continue;
            const dx = tp.x-p.x, dy = tp.y-p.y;
            if (Math.sqrt(dx*dx+dy*dy) < 14+5) {
                let dmg = p.damage || 10;
                if (p.isGun && p.spawnX !== undefined) {
                    const td = Math.hypot(p.x-p.spawnX, p.y-p.spawnY);
                    if (td < 80) dmg = Math.round(dmg*(0.35+td/80*0.65));
                }
                dealDamageToPlayer(tid, dmg);
                projectiles.splice(i, 1);
                break;
            }
        }
    }
}

// ── İsim modal ───────────────────────────────────────────────────────────────
(function() {
    const modal = document.getElementById('mp-name-modal');
    const input = document.getElementById('mp-name-input');
    const btn   = document.getElementById('mp-name-btn');
    const chatInput = document.getElementById('chat-input');
    const chatToggle = document.getElementById('chat-toggle');
    input.value = localStorage.getItem('aeroPlayerName') || '';

    function startGame() {
        const name = input.value.trim() || `Oyuncu${Math.floor(Math.random()*999)}`;
        playerName = name;
        localStorage.setItem('aeroPlayerName', name);
        modal.style.display = 'none';
        connectWS();
    }
    btn.addEventListener('click', startGame);
    input.addEventListener('keydown', e => { if(e.key==='Enter') startGame(); });

    // Chat toggle
    let chatOpen = false;
    chatToggle.addEventListener('click', () => {
        chatOpen = !chatOpen;
        chatInput.style.display = chatOpen ? 'block' : 'none';
        if (chatOpen) chatInput.focus();
    });
    chatInput.addEventListener('blur', () => {
        setTimeout(() => { chatOpen = false; chatInput.style.display = 'none'; }, 200);
    });
})();

    chatInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && chatInput.value.trim()) {
