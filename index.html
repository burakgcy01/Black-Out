<style>
*{box-sizing:border-box}
body,html{margin:0;padding:0;width:100%;height:100%;background:#050508;overflow:hidden;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;color:#e0e0e0;user-select:none;touch-action:none}
canvas{display:block}
#bars-container{position:absolute;top:15px;left:15px;display:flex;flex-direction:row;align-items:flex-start;gap:10px;pointer-events:none}
.bar-group{display:flex;flex-direction:column;align-items:center;gap:6px}
.bar-emoji{font-size:20px}
.bar-track{width:18px;height:140px;background:rgba(0,0,0,0.4);border-radius:9px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}

#switch-weapon-btn{bottom:200px;right:55px;width:36px;height:36px;font-size:16px;border-color:#a855f7;color:#a855f7;background:rgba(168,85,247,0.15);box-shadow:0 0 12px rgba(168,85,247,0.3)}

#food-btn{bottom:100px;left:50%;transform:translateX(-50%) translateX(20px);width:52px;height:52px;font-size:22px;border-color:#22c55e;color:#22c55e;background:rgba(34,197,94,0.15);box-shadow:0 0 14px rgba(34,197,94,0.3)}
#food-btn:active{background:rgba(34,197,94,0.4)}
#joystick-base{position:fixed;left:110px;bottom:110px;width:110px;height:110px;background:rgba(168,85,247,0.1);border:3px solid rgba(168,85,247,0.4);border-radius:50%;pointer-events:none;transform:translate(-50%,50%);z-index:10}
#joystick-stick{position:fixed;left:110px;bottom:110px;width:45px;height:45px;background:rgba(168,85,247,0.8);border:3px solid #a855f7;border-radius:50%;pointer-events:none;transform:translate(-50%,50%);box-shadow:0 0 20px rgba(168,85,247,0.6);z-index:11}
.notification{position:absolute;top:120px;left:50%;transform:translateX(-50%);background:rgba(168,85,247,0.95);color:#000;padding:14px 28px;border-radius:12px;font-weight:700;font-size:15px;pointer-events:none;opacity:0;transition:opacity 0.3s;box-shadow:0 4px 20px rgba(168,85,247,0.6);z-index:100}
.notification.show{opacity:1}
#chest-blocker{position:fixed;top:0;left:0;width:100%;height:100%;z-index:900;display:none;}
#menu-btn,#inv-btn{position:relative;background:rgba(168,85,247,0.2);border:2px solid #a855f7;border-radius:12px;color:#c084fc;font-weight:700;cursor:pointer;pointer-events:auto;backdrop-filter:blur(8px);box-shadow:0 0 14px rgba(168,85,247,0.4);transition:all 0.2s}
#menu-btn{font-size:18px;padding:6px 12px}
#inv-btn{font-size:16px;padding:6px 10px}
#menu-btn:hover,#inv-btn:hover{background:rgba(168,85,247,0.4)}
#world-select-modal .world-option{background:rgba(30,35,55,0.6);border:2px solid rgba(168,85,247,0.3);border-radius:12px;padding:20px;margin-bottom:12px;cursor:pointer;transition:all 0.3s}
#world-select-modal .world-option:hover{border-color:#a855f7;transform:translateY(-2px);box-shadow:0 6px 20px rgba(168,85,247,0.3)}
#world-select-modal .world-option.active{border-color:#a855f7;background:rgba(168,85,247,0.15)}
#world-select-modal .world-name{font-size:18px;font-weight:700;color:#c084fc;margin-bottom:6px}
#world-select-modal .world-desc{font-size:13px;color:#9ca3af}

#duel-result{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:2000;flex-direction:column;gap:20px}
#duel-result.show{display:flex}
#duel-result-text{font-size:52px;font-weight:900;text-shadow:0 0 40px currentColor}
#duel-result-sub{font-size:18px;color:#9ca3af}
#duel-result-btn{background:rgba(168,85,247,0.3);border:2px solid #a855f7;color:#c084fc;font-size:18px;font-weight:700;padding:14px 36px;border-radius:14px;cursor:pointer;transition:all 0.2s}
#duel-result-btn:hover{background:rgba(168,85,247,0.5)}
.inv-slot{background:rgba(30,35,55,0.7);border:2px solid rgba(168,85,247,0.3);border-radius:12px;padding:12px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px}
.inv-slot-icon{font-size:28px;min-width:36px;text-align:center}
.inv-slot-info{flex:1}
.inv-slot-name{font-size:15px;font-weight:700;color:#c084fc}
.inv-slot-count{font-size:13px;color:#9ca3af;margin-top:2px}
.inv-slot-qty{font-size:22px;font-weight:900;color:#fbbf24;min-width:40px;text-align:right}
</style>
</head>
<body>

<!-- Multiplayer UI -->

<canvas id="gameCanvas"></canvas>
<script>
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');
canvas.width=window.innerWidth; canvas.height=window.innerHeight;
window.addEventListener('resize',()=>{canvas.width=window.innerWidth;canvas.height=window.innerHeight;});

if(!CanvasRenderingContext2D.prototype.roundRect){
    CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
        this.beginPath();this.moveTo(x+r,y);this.lineTo(x+w-r,y);this.quadraticCurveTo(x+w,y,x+w,y+r);
        this.lineTo(x+w,y+h-r);this.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
        this.lineTo(x+r,y+h);this.quadraticCurveTo(x,y+h,x,y+h-r);
        this.lineTo(x,y+r);this.quadraticCurveTo(x,y,x+r,y);this.closePath();
    };
}

let audioCtx=null;
function getAudioCtx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}
function playTone(opts){
    try{
        const ac=getAudioCtx();
        const{type='sine',freq=440,freq2=freq,duration=0.18,volume=0.3,attack=0.005,decay=0.05,sustain=0.4,release=0.1,delay=0,distortion=false}=opts;
        const osc=ac.createOscillator(),gain=ac.createGain(),now=ac.currentTime+delay;
        let src=osc;
        if(distortion){const ws=ac.createWaveShaper(),c=new Float32Array(256);for(let i=0;i<256;i++){const x=(i*2/256)-1;c[i]=x*(Math.abs(x)+0.5)/(1+0.5*x*x);}ws.curve=c;osc.connect(ws);ws.connect(gain);}
        else osc.connect(gain);
        gain.connect(ac.destination);
        osc.type=type;osc.frequency.setValueAtTime(freq,now);
        if(freq!==freq2)osc.frequency.exponentialRampToValueAtTime(Math.max(0.01,freq2),now+duration);
        gain.gain.setValueAtTime(0,now);gain.gain.linearRampToValueAtTime(volume,now+attack);
        gain.gain.linearRampToValueAtTime(volume*sustain,now+attack+decay);
        gain.gain.setValueAtTime(volume*sustain,now+duration-release);gain.gain.linearRampToValueAtTime(0,now+duration);
        osc.start(now);osc.stop(now+duration+0.01);
    }catch(e){}
}
function playNoise(opts){
    try{
        const ac=getAudioCtx();
        const{duration=0.1,volume=0.2,freq=1200,q=1,delay=0}=opts;
        const buf=ac.createBuffer(1,Math.floor(ac.sampleRate*duration),ac.sampleRate);
        const data=buf.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;
        const src=ac.createBufferSource(),flt=ac.createBiquadFilter(),gain=ac.createGain(),now=ac.currentTime+delay;
        src.buffer=buf;flt.type='bandpass';flt.frequency.value=freq;flt.Q.value=q;
        gain.gain.setValueAtTime(volume,now);gain.gain.exponentialRampToValueAtTime(0.001,now+duration);
        src.connect(flt);flt.connect(gain);gain.connect(ac.destination);src.start(now);src.stop(now+duration);
    }catch(e){}
}

const SFX={
    gridStep:()=>{playTone({type:'sine',freq:320,freq2:280,duration:0.08,volume:0.12,attack:0.003,decay:0.02,sustain:0.3,release:0.02});playNoise({duration:0.06,volume:0.08,freq:2400,q:2});},
    jump:()=>playTone({type:'sine',freq:220,freq2:440,duration:0.2,volume:0.25,attack:0.01,decay:0.04,sustain:0.5,release:0.1}),
    land:()=>{playNoise({duration:0.12,volume:0.25,freq:180,q:0.5});playTone({type:'sine',freq:90,freq2:60,duration:0.1,volume:0.2,attack:0.002,decay:0.05,sustain:0.1,release:0.04});},
    swordSwing:()=>{playNoise({duration:0.15,volume:0.3,freq:1800,q:1.5});playTone({type:'sawtooth',freq:280,freq2:180,duration:0.14,volume:0.18,attack:0.004,decay:0.05,sustain:0.2,release:0.05,distortion:true});},
    swordHitSound:()=>{playNoise({duration:0.12,volume:0.35,freq:900,q:2});playTone({type:'square',freq:180,freq2:90,duration:0.15,volume:0.25,attack:0.003,decay:0.06,sustain:0.2,release:0.06,distortion:true});},
    bowDraw:()=>playTone({type:'sine',freq:500,freq2:700,duration:0.5,volume:0.1,attack:0.05,decay:0.1,sustain:0.6,release:0.15}),
    bowShoot:()=>{playNoise({duration:0.08,volume:0.3,freq:3000,q:3});playTone({type:'sine',freq:600,freq2:200,duration:0.18,volume:0.2,attack:0.003,decay:0.08,sustain:0.2,release:0.08});},
    arrowHit:()=>{playNoise({duration:0.1,volume:0.28,freq:1200,q:2});playTone({type:'triangle',freq:250,freq2:150,duration:0.12,volume:0.2,attack:0.003,decay:0.05,sustain:0.2,release:0.05});},
    weaponSwitch:()=>{playTone({type:'sine',freq:440,freq2:660,duration:0.12,volume:0.3,attack:0.005,decay:0.04,sustain:0.4,release:0.06});playTone({type:'sine',freq:550,freq2:770,duration:0.12,volume:0.2,attack:0.005,delay:0.06,decay:0.04,sustain:0.3,release:0.05});},
    craft:()=>{[440,554,659].forEach((f,i)=>playTone({type:'sine',freq:f,duration:0.1+i*0.05,volume:0.3+i*0.05,attack:0.01,delay:i*0.08,decay:0.03,sustain:0.5,release:0.06+i*0.02}));},
    collect:()=>playTone({type:'sine',freq:660,freq2:880,duration:0.18,volume:0.3,attack:0.01,decay:0.05,sustain:0.5,release:0.1}),
    gridPlace:()=>{playTone({type:'sine',freq:300,freq2:500,duration:0.22,volume:0.3,attack:0.01,decay:0.06,sustain:0.4,release:0.1});playNoise({duration:0.1,volume:0.2,freq:800,q:1.5});},
    playerHurt:()=>playTone({type:'square',freq:160,freq2:80,duration:0.18,volume:0.3,attack:0.003,decay:0.06,sustain:0.2,release:0.07,distortion:true}),
    duelStart:()=>{for(let i=0;i<3;i++)playTone({type:'square',freq:330+i*110,duration:0.18,volume:0.3,attack:0.005,delay:i*0.2,decay:0.05,sustain:0.5,release:0.08});},
    win:()=>[523,659,784,1047].forEach((f,i)=>playTone({type:'sine',freq:f,duration:0.3,volume:0.35,attack:0.01,delay:i*0.15,decay:0.05,sustain:0.6,release:0.12})),
    lose:()=>[330,277,220,165].forEach((f,i)=>playTone({type:'sine',freq:f,duration:0.35,volume:0.3,attack:0.01,delay:i*0.18,decay:0.06,sustain:0.5,release:0.12})),
    grenadeThrow:()=>{playNoise({duration:0.08,volume:0.2,freq:400,q:1});playTone({type:'sine',freq:300,freq2:450,duration:0.1,volume:0.2,attack:0.005,decay:0.04,sustain:0.3,release:0.04});},
    grenadeExplode:()=>{playNoise({duration:0.35,volume:0.55,freq:120,q:0.4});playTone({type:'sawtooth',freq:80,freq2:30,duration:0.3,volume:0.4,attack:0.003,decay:0.1,sustain:0.3,release:0.15,distortion:true});playTone({type:'sine',freq:200,freq2:50,duration:0.25,volume:0.3,attack:0.005,delay:0.04,decay:0.1,sustain:0.2,release:0.1});},
    gunShoot:()=>{playNoise({duration:0.07,volume:0.55,freq:800,q:0.6});playTone({type:'sawtooth',freq:120,freq2:55,duration:0.12,volume:0.4,attack:0.002,decay:0.04,sustain:0.1,release:0.06,distortion:true});},
    gunEmpty:()=>playTone({type:'square',freq:300,freq2:250,duration:0.06,volume:0.2,attack:0.002,decay:0.02,sustain:0.1,release:0.02}),
    gunReload:()=>{playTone({type:'sine',freq:500,freq2:300,duration:0.15,volume:0.25,attack:0.01,decay:0.05,sustain:0.3,release:0.07});setTimeout(()=>playTone({type:'sine',freq:350,freq2:600,duration:0.15,volume:0.3,attack:0.01,decay:0.05,sustain:0.3,release:0.07}),200);},
    eat:()=>{
        // Crunch sounds: 3 random bursts
        for(let i=0;i<4;i++)setTimeout(()=>{playNoise({duration:0.06,volume:0.18,freq:1800+Math.random()*800,q:3});playTone({type:'triangle',freq:180+Math.random()*80,freq2:120,duration:0.05,volume:0.1,attack:0.002,decay:0.03,sustain:0.1,release:0.015});},i*160+Math.random()*60);
    },

        player.hasSword=mode==='sword';player.hasBow=mode==='bow';player.hasGrenade=mode==='grenade';player.hasGun=mode==='gun';

}

const TORCH_RADIUS=3; // 3x3 -> radius 1.5 tiles, smooth falloff to 3
function rebuildLightMap(){
    lightMap.clear();
    const torchesInWorld=placedTorches.filter(t=>t.world===currentWorld);
    if(torchesInWorld.length===0){lightMapDirty=false;return;}
    for(const [key,cell] of grid){
        if(cell.isWall&&cell.type!=='chest')continue;
        const [gx,gy]=key.split(',').map(Number);
        let bright=0;
        for(const t of torchesInWorld){
            const dx=gx-t.gx,dy=gy-t.gy;
            const dist=Math.sqrt(dx*dx+dy*dy);
            const b=Math.max(0,1-dist/TORCH_RADIUS);
            if(b>bright)bright=b;
        }
        if(bright>0)lightMap.set(key,bright);
    }
    lightMapDirty=false;
}
function getTileBrightness(gx,gy){
    const hasTorches=placedTorches.some(t=>t.world===currentWorld);
    if(!hasTorches)return 0; // no torches = fully dark

}

// Sandık çizimi (dünyada)
function drawPlacedChests(){
    const S=18; // half-size: chest is 36x36px (3/5 of tile)
    for(const c of placedChests){
        if(c.world!==currentWorld)continue;
        const sx=c.x-camera.x,sy=c.y-camera.y;
        const near=Math.hypot(player.x-c.x,player.y-c.y)<60;
        const isOpen=chestInvOpen&&placedChests[openChestIdx]===c;
        const t=Date.now()*0.001;
        ctx.save();
        ctx.shadowColor='#fbbf24';ctx.shadowBlur=near?16:5;
        // Shadow beneath
        ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(sx,sy+S+2,S*0.9,4,0,0,Math.PI*2);ctx.fill();
        // --- BODY ---
        // Base wood
        const woodGrad=ctx.createLinearGradient(sx-S,sy-S,sx-S,sy+S);
        woodGrad.addColorStop(0,isOpen?'#5c4a2a':'#8B5E2A');
        woodGrad.addColorStop(0.5,isOpen?'#4a3820':'#6B3E0E');
        woodGrad.addColorStop(1,isOpen?'#3a2c18':'#4a2800');
        ctx.fillStyle=woodGrad;
        ctx.beginPath();ctx.roundRect(sx-S,sy-S,S*2,S*2,4);ctx.fill();
        // Wood grain lines
        ctx.strokeStyle=isOpen?'rgba(80,60,30,0.4)':'rgba(160,90,20,0.35)';
        ctx.lineWidth=1;
        for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(sx-S+2,sy+i*6);ctx.lineTo(sx+S-2,sy+i*6);ctx.stroke();}
        // Vertical plank dividers
        ctx.strokeStyle=isOpen?'rgba(40,30,12,0.5)':'rgba(90,40,5,0.5)';
        ctx.lineWidth=1.5;
        ctx.beginPath();ctx.moveTo(sx-S*0.33,sy-S+2);ctx.lineTo(sx-S*0.33,sy+S-2);ctx.stroke();
        ctx.beginPath();ctx.moveTo(sx+S*0.33,sy-S+2);ctx.lineTo(sx+S*0.33,sy+S-2);ctx.stroke();
        // Lid separation line
        ctx.strokeStyle=isOpen?'rgba(120,100,60,0.7)':'rgba(255,180,0,0.6)';
        ctx.lineWidth=1.5;
        ctx.beginPath();ctx.moveTo(sx-S+2,sy-3);ctx.lineTo(sx+S-2,sy-3);ctx.stroke();
        // Metal border
        ctx.strokeStyle=isOpen?'#78716c':'#d97706';
        ctx.lineWidth=2;
        ctx.beginPath();ctx.roundRect(sx-S,sy-S,S*2,S*2,4);ctx.stroke();
        // Metal corner brackets
        ctx.fillStyle=isOpen?'#57534e':'#fbbf24';
        const bSize=5;
        for(const[bx,by]of[[-S,-S],[S-bSize,-S],[-S,S-bSize],[S-bSize,S-bSize]]){
            ctx.fillRect(sx+bx,sy+by,bSize,bSize);
        }
        // Horizontal metal band
        ctx.fillStyle=isOpen?'rgba(87,83,78,0.6)':'rgba(217,119,6,0.5)';
        ctx.fillRect(sx-S,sy-4,S*2,7);
        // Lock/clasp
        if(!isOpen){
            // Clasp background
            ctx.fillStyle='#92400e';ctx.beginPath();ctx.roundRect(sx-5,sy-6,10,9,2);ctx.fill();
            // Gold lock
            ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.arc(sx,sy-3,3.5,0,Math.PI*2);ctx.fill();
            ctx.fillStyle='#92400e';ctx.beginPath();ctx.arc(sx,sy-3,1.5,0,Math.PI*2);ctx.fill();
            ctx.fillStyle='#fbbf24';ctx.fillRect(sx-2,sy-2,4,4);
            ctx.fillStyle='#92400e';ctx.fillRect(sx-1,sy-1,2,3);
        } else {
            // Open: darker interior hint
            ctx.fillStyle='rgba(0,0,0,0.5)';ctx.beginPath();ctx.roundRect(sx-S+3,sy-S+3,S*2-6,S-5,2);ctx.fill();
            ctx.fillStyle='rgba(255,200,50,0.15)';ctx.beginPath();ctx.roundRect(sx-S+3,sy-S+3,S*2-6,S-5,2);ctx.fill();
        }
        // Glow pulse when near
        if(near&&!isOpen){const p=0.3+0.2*Math.sin(t*3);ctx.strokeStyle=`rgba(251,191,36,${p})`;ctx.lineWidth=2.5;ctx.beginPath();ctx.roundRect(sx-S-2,sy-S-2,S*2+4,S*2+4,6);ctx.stroke();}
        ctx.restore();
        // Item count indicator
        const itemCount=c.items.filter(Boolean).length;
        if(itemCount>0){
            ctx.fillStyle='#fbbf24';ctx.font='bold 8px Segoe UI';ctx.textAlign='center';

function _chestLayout(){
    const pSlots=getInvSlots();
    const SLOT=60,PAD=8,PP=14;
    const pRows=Math.ceil(Math.max(pSlots.length,1)/CHEST_COLS)||1;
    const cRows=Math.ceil(CHEST_SLOTS/CHEST_COLS);
    const panelW=CHEST_COLS*(SLOT+PAD)+PAD+PP*2;
    const pSecH=pRows*(SLOT+PAD)+PAD+28;
    const cSecH=cRows*(SLOT+PAD)+PAD+28;
    const totalH=pSecH+cSecH+PP*2+12;
    const panelX=(canvas.width-panelW)/2,panelY=(canvas.height-totalH)/2;
    const pSecY=panelY+PP,cSecY=panelY+PP+pSecH+12;
    return{SLOT,PAD,PP,panelW,panelX,panelY,totalH,pSecH,pSecY,cSecY,pSlots};
}
function chestInvHandleDown(cx,cy){
    if(!chestInvOpen)return false;
    const L=_chestLayout();
    const closeX=L.panelX+L.panelW-18,closeY=L.panelY+18;
    if(Math.hypot(cx-closeX,cy-closeY)<16){closeChestUI();return true;}
    for(let i=0;i<L.pSlots.length;i++){
        const col=i%CHEST_COLS,row=Math.floor(i/CHEST_COLS);
        const rx=L.panelX+L.PP+L.PAD+col*(L.SLOT+L.PAD),ry=L.pSecY+28+L.PAD+row*(L.SLOT+L.PAD);
        if(cx>=rx&&cx<=rx+L.SLOT&&cy>=ry&&cy<=ry+L.SLOT){if(L.pSlots[i])chestDrag={source:'player',idx:i,slot:L.pSlots[i],startX:cx,startY:cy,curX:cx,curY:cy};return true;}
    }
    const chest=placedChests[openChestIdx];
    for(let i=0;i<CHEST_SLOTS;i++){
        const col=i%CHEST_COLS,row=Math.floor(i/CHEST_COLS);
        const rx=L.panelX+L.PP+L.PAD+col*(L.SLOT+L.PAD),ry=L.cSecY+28+L.PAD+row*(L.SLOT+L.PAD);
        if(cx>=rx&&cx<=rx+L.SLOT&&cy>=ry&&cy<=ry+L.SLOT){if(chest.items[i])chestDrag={source:'chest',idx:i,slot:chest.items[i],startX:cx,startY:cy,curX:cx,curY:cy};return true;}
    }
    if(cx<L.panelX||cx>L.panelX+L.panelW||cy<L.panelY||cy>L.panelY+L.totalH)closeChestUI();
    return true;
}
function chestInvHandleMove(cx,cy){if(chestDrag){chestDrag.curX=cx;chestDrag.curY=cy;}}
function chestInvHandleUp(cx,cy){
    if(!chestDrag)return;
    const d=chestDrag;chestDrag=null;
    if(Math.hypot(cx-d.startX,cy-d.startY)<=8)return;
    const L=_chestLayout();const chest=placedChests[openChestIdx];
    // Check if dropped on chest slot
    for(let i=0;i<CHEST_SLOTS;i++){
        const col=i%CHEST_COLS,row=Math.floor(i/CHEST_COLS);
        const rx=L.panelX+L.PP+L.PAD+col*(L.SLOT+L.PAD),ry=L.cSecY+28+L.PAD+row*(L.SLOT+L.PAD);
        if(cx>=rx&&cx<=rx+L.SLOT&&cy>=ry&&cy<=ry+L.SLOT){
            if(d.source==='player'){
                if(chest.items[i])return;
                const s=d.slot;
                if(s.type==='resource'){resources[s.key]=0;updateResources();}
                else{const wMode=s.key.replace('has','').toLowerCase();player[s.key]=false;ownedWeapons.delete(wMode);if(player.handSlot1===wMode)player.handSlot1=null;if(player.handSlot2===wMode)player.handSlot2=null;_syncActiveWeapon();}
                chest.items[i]=s;SFX.collect();
            } else if(!chest.items[i]){chest.items[i]=chest.items[d.idx];chest.items[d.idx]=undefined;}
            return;
        }
    }
    // Check if dropped anywhere in the player inventory section (entire area including empty space)
    const pSecTop=L.pSecY+28;
    const pSecBottom=L.pSecY+28+L.pSecH;
    const invLeft=L.panelX+L.PP;
    const invRight=L.panelX+L.panelW-L.PP;
    if(d.source==='chest'&&cx>=invLeft&&cx<=invRight&&cy>=pSecTop&&cy<=pSecBottom){
        const item=chest.items[d.idx];if(!item)return;
        if(item.type==='chips'){player.chipsCount=(player.chipsCount||0)+item.qty;updateFoodBtn();}
        else if(item.type==='resource'){resources[item.key]=(resources[item.key]||0)+item.qty;updateResources();}
        else{player[item.key]=true;const wMode=item.key.replace('has','').toLowerCase();ownedWeapons.add(wMode);_autoAssignHandSlot(wMode);if(item.key==='hasGun'){player.gunAmmo=player.gunMaxAmmo;player.gunReloading=false;}}
        chest.items[d.idx]=undefined;SFX.collect();
        return;
    }
    // Also check individual player slots for player->chest direction
    for(let i=0;i<=L.pSlots.length;i++){
        const col=i%CHEST_COLS,row=Math.floor(i/CHEST_COLS);
        const rx=L.panelX+L.PP+L.PAD+col*(L.SLOT+L.PAD),ry=L.pSecY+28+L.PAD+row*(L.SLOT+L.PAD);
        if(cx>=rx&&cx<=rx+L.SLOT&&cy>=ry&&cy<=ry+L.SLOT){
            if(d.source==='chest'){
                const item=chest.items[d.idx];if(!item)return;
                if(item.type==='chips'){player.chipsCount=(player.chipsCount||0)+item.qty;updateFoodBtn();}
                else if(item.type==='resource'){resources[item.key]=(resources[item.key]||0)+item.qty;updateResources();}
                else{player[item.key]=true;const wMode=item.key.replace('has','').toLowerCase();ownedWeapons.add(wMode);_autoAssignHandSlot(wMode);if(item.key==='hasGun'){player.gunAmmo=player.gunMaxAmmo;player.gunReloading=false;}}
                chest.items[d.idx]=undefined;SFX.collect();
            }
            return;
        }
    }
}

function updateWorldItems(){
    for(let i=worldItems.length-1;i>=0;i--){
        const w=worldItems[i];
        if(w.world!==currentWorld)continue;
        if(w.cooldown>0){w.cooldown--;continue;}
        if(!isOnGridWorld(w.x,w.y)){worldItems.splice(i,1);continue;}
        if(Math.hypot(w.x-player.x,w.y-player.y)<22){
            if(w.type==='resource'){resources[w.key]=(resources[w.key]||0)+w.qty;updateResources();}
            else{player[w.key]=true;const wMode=w.key.replace('has','').toLowerCase();ownedWeapons.add(wMode);if(!player.activeWeaponMode){player.activeWeaponMode=wMode;updateInteractBtn();}}
            playTone({type:'sine',freq:520,freq2:640,duration:0.15,volume:0.2,attack:0.01,decay:0.04,sustain:0.4,release:0.04});
            worldItems.splice(i,1);continue;
        }
        const tryPickup=(tx,ty)=>{
            if(Math.hypot(w.x-tx,w.y-ty)<65){if(w.type==='resource'){resources[w.key]=(resources[w.key]||0)+w.qty;updateResources();}worldItems.splice(i,1);return true;}
            return false;
        };
        if(currentWorld==='lobby'){if(tryPickup(npc.x,npc.y))continue;if(tryPickup(elementMaster.x,elementMaster.y))continue;}
        if(duelActive&&!cpu.isDead){if(Math.hypot(w.x-cpu.x,w.y-cpu.y)<65){if(w.type==='weapon')cpu[w.key]=true;worldItems.splice(i,1);}}
    }
}

function drawWorldItems(){
    for(const w of worldItems){
        if(w.world!==currentWorld)continue;
        w.bob=(w.bob||0)+0.05;
        const sx=w.x-camera.x,sy=w.y-camera.y+Math.sin(w.bob)*5;
        ctx.fillStyle='rgba(0,0,0,0.25)';ctx.beginPath();ctx.ellipse(sx,w.y-camera.y+2,14,5,0,0,Math.PI*2);ctx.fill();
        ctx.save();ctx.globalAlpha=1;ctx.shadowColor='#a855f7';ctx.shadowBlur=14;ctx.font='26px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(w.icon,sx,sy);ctx.restore();
        if(w.qty>1){
            ctx.fillStyle='rgba(0,0,0,0.7)';ctx.beginPath();ctx.arc(sx+14,sy-14,10,0,Math.PI*2);ctx.fill();
            ctx.fillStyle='#fbbf24';ctx.font='bold 11px Segoe UI';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(w.qty,sx+14,sy-14);ctx.globalAlpha=1;
        }
    }
}

        ctx.save();ctx.strokeStyle='rgba(96,165,250,0.9)';ctx.lineWidth=3.5;ctx.shadowColor='#60a5fa';ctx.shadowBlur=16;
        ctx.beginPath();ctx.arc(previewCX,previewCY,pr+7,0,Math.PI*2);ctx.stroke();
        ctx.lineWidth=2.5;ctx.shadowBlur=10;
        for(let i=0;i<6;i++){const a=(i/6)*Math.PI*2+t*0.5;ctx.beginPath();ctx.arc(previewCX+Math.cos(a)*(pr+4),previewCY+Math.sin(a)*(pr+4),5,a-0.6,a+0.6);ctx.stroke();}
        ctx.strokeStyle='rgba(96,165,250,0.35)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(previewCX,previewCY,pr+12,0,Math.PI*2);ctx.stroke();
        ctx.restore();
    }

    // ── HAND SLOTS ── (left and right of character preview)
    const handSlotSize=54;
    const handSlot1X=panelX+10; // left side
    const handSlot2X=panelX+panelW-10-handSlotSize; // right side
    const handSlotMidY=previewY+PREVIEW_H/2-handSlotSize/2; // vertically centered

    function drawHandSlot(hx,hy,slotMode,slotIdx,isDragging){
        const wObj=slotMode?INV_WEAPONS.find(w=>w.key==='has'+slotMode.charAt(0).toUpperCase()+slotMode.slice(1)):null;
        const isActive=slotMode&&player.activeWeaponMode===slotMode;
        ctx.fillStyle=isActive?'rgba(168,85,247,0.3)':slotMode?'rgba(168,85,247,0.15)':'rgba(20,25,50,0.5)';
        ctx.strokeStyle=isActive?'#a855f7':slotMode?'rgba(168,85,247,0.6)':'rgba(168,85,247,0.2)';
        ctx.lineWidth=isActive?2.5:1.5;
        ctx.beginPath();ctx.roundRect(hx,hy,handSlotSize,handSlotSize,10);ctx.fill();ctx.stroke();
        // Slot label
        ctx.fillStyle='rgba(168,85,247,0.5)';ctx.font='bold 8px Segoe UI';ctx.textAlign='center';ctx.textBaseline='bottom';
        ctx.fillText(slotIdx===0?'⬅ EL':'EL ➡',hx+handSlotSize/2,hy);
        if(wObj&&!isDragging){
            ctx.font='26px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(wObj.icon,hx+handSlotSize/2,hy+handSlotSize/2-6);
            ctx.fillStyle=isActive?'#e0aaff':'#c084fc';ctx.font='bold 7px Segoe UI';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText(wObj.name,hx+handSlotSize/2,hy+handSlotSize-14);
            if(isActive){ctx.fillStyle='#fbbf24';ctx.font='bold 6px Segoe UI';ctx.textAlign='center';ctx.fillText('▶ AKTİF',hx+handSlotSize/2,hy+handSlotSize-6);}
        }else if(!wObj){
            ctx.fillStyle='rgba(168,85,247,0.15)';ctx.font='22px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🤚',hx+handSlotSize/2,hy+handSlotSize/2);
        }
    }
    const isDragSlot1=dragItem&&dragItem.source==='hand'&&dragItem.slotIdx===0;
    const isDragSlot2=dragItem&&dragItem.source==='hand'&&dragItem.slotIdx===1;
    drawHandSlot(handSlot1X,handSlotMidY,player.handSlot1,0,isDragSlot1);
    drawHandSlot(handSlot2X,handSlotMidY,player.handSlot2,1,isDragSlot2);
    window._invHandSlots=[
        {x:handSlot1X,y:handSlotMidY,w:handSlotSize,h:handSlotSize,slotIdx:0},
        {x:handSlot2X,y:handSlotMidY,w:handSlotSize,h:handSlotSize,slotIdx:1}
    ];
    window._invHandSlot=window._invHandSlots[0];

    // ── ITEM SLOTS ── (below preview)
    const slotsStartY=panelY+44+PREVIEW_H+16;
    if(slots.length>0){
        ctx.fillStyle='rgba(168,85,247,0.4)';ctx.font='bold 10px Segoe UI';ctx.textAlign='left';ctx.textBaseline='bottom';
        ctx.fillText('EŞYALAR',panelX+INV_PANEL_PAD,slotsStartY);
    }
    for(let i=0;i<slots.length;i++){
        if(dragItem&&dragItem.source==='inv'&&dragItem.idx===i)continue;
        const r=getSlotRect(i,invLayout),s=slots[i];
        const sz=invLayout.slotSz||SLOT_SIZE;
        // Highlight if this is the active weapon
        const isActiveSlot=s.type==='weapon'&&player.activeWeaponMode&&s.key==='has'+player.activeWeaponMode.charAt(0).toUpperCase()+player.activeWeaponMode.slice(1);
        ctx.fillStyle=isActiveSlot?'rgba(168,85,247,0.25)':'rgba(30,35,60,0.8)';
        ctx.strokeStyle=isActiveSlot?'rgba(168,85,247,0.9)':'rgba(168,85,247,0.35)';
        ctx.lineWidth=isActiveSlot?2.5:1.5;
        ctx.beginPath();ctx.roundRect(r.x,r.y,r.w,r.h,10);ctx.fill();ctx.stroke();
        ctx.font=`${Math.round(sz*0.42)}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(s.icon,r.x+r.w/2,r.y+r.h/2-8);
        ctx.fillStyle=isActiveSlot?'#e0aaff':'#c084fc';ctx.font=`bold ${Math.max(7,Math.round(sz*0.12))}px Segoe UI`;ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText(s.name,r.x+r.w/2,r.y+r.h-18);
        if(s.type==='resource'||s.type==='chips'){
            ctx.fillStyle='rgba(0,0,0,0.7)';ctx.beginPath();ctx.arc(r.x+r.w-10,r.y+10,10,0,Math.PI*2);ctx.fill();
            ctx.fillStyle='#fbbf24';ctx.font='bold 10px Segoe UI';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(s.qty,r.x+r.w-10,r.y+10);
        }
    }
    if(slots.length===0){ctx.fillStyle='#4b5563';ctx.font='12px Segoe UI';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('Eşya yok',panelX+panelW/2,slotsStartY+40);}

    // Dragged item
    if(dragItem){
        const s=dragItem.slot,{curX,curY}=dragItem;
        ctx.save();ctx.shadowColor='#a855f7';ctx.shadowBlur=20;ctx.font='44px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.globalAlpha=0.9;ctx.fillText(s.icon,curX,curY);ctx.restore();
    }
}

function getInvLayout(){
    const slots=getInvSlots(),cols=INV_COLS,rows=Math.ceil(slots.length/cols)||1;
    const PREVIEW_H=110,HAND_H=0;
    const slotSz=Math.min(SLOT_SIZE,Math.floor((canvas.width-36-INV_PANEL_PAD*2-SLOT_PAD*(cols+1))/cols));
    const panelW=Math.min(canvas.width-16,cols*(slotSz+SLOT_PAD)+SLOT_PAD+INV_PANEL_PAD*2);
    const panelH=44+PREVIEW_H+16+(rows*(slotSz+SLOT_PAD)+SLOT_PAD)+INV_PANEL_PAD+12;
    const panelX=(canvas.width-panelW)/2;
    const clampedH=Math.min(panelH,canvas.height-20);
    const panelY=Math.max(10,(canvas.height-clampedH)/2);
    return{slots,cols,rows,panelW,panelH:clampedH,panelX,panelY,PREVIEW_H,HAND_H,slotSz};
}
function getSlotRect(idx,layout){
    const col=idx%layout.cols,row=Math.floor(idx/layout.cols);
    const PREVIEW_H=layout.PREVIEW_H||110;
    const slotSz=layout.slotSz||SLOT_SIZE;
    const slotsStartY=layout.panelY+44+PREVIEW_H+16;
    return{x:layout.panelX+INV_PANEL_PAD+SLOT_PAD+col*(slotSz+SLOT_PAD),y:slotsStartY+SLOT_PAD+row*(slotSz+SLOT_PAD),w:slotSz,h:slotSz};
}

function isInsideInvPanel(x,y){if(!invLayout)return false;const{panelX,panelY,panelW,panelH}=invLayout;return x>=panelX&&x<=panelX+panelW&&y>=panelY&&y<=panelY+panelH;}

function invHandleDown(cx,cy){
    if(!canvasInvOpen)return false;
    invLayout=getInvLayout();
    const{slots,panelX,panelY,panelW}=invLayout;
    if(Math.hypot(cx-(panelX+panelW-24),cy-(panelY+24))<16){closeInventory();return true;}
    // Check hand slots drag
    const hSlots=window._invHandSlots||[];
    for(const hs of hSlots){
        if(cx>=hs.x&&cx<=hs.x+hs.w&&cy>=hs.y&&cy<=hs.y+hs.h){
            const slotMode=hs.slotIdx===0?player.handSlot1:player.handSlot2;
            if(slotMode){
                const wObj=INV_WEAPONS.find(w=>w.key==='has'+slotMode.charAt(0).toUpperCase()+slotMode.slice(1));
                if(wObj){dragItem={source:'hand',slotIdx:hs.slotIdx,idx:-1,slot:{...wObj,type:'weapon',qty:1},startX:cx,startY:cy,curX:cx,curY:cy};return true;}
            }
            return true;
        }
    }
    // Item slots
    for(let i=0;i<slots.length;i++){const r=getSlotRect(i,invLayout);if(cx>=r.x&&cx<=r.x+r.w&&cy>=r.y&&cy<=r.y+r.h){dragItem={source:'inv',idx:i,slot:slots[i],startX:cx,startY:cy,curX:cx,curY:cy};return true;}}
    if(!isInsideInvPanel(cx,cy)){closeInventory();return true;}
    return true;
}
function invHandleMove(cx,cy){if(!canvasInvOpen)return false;if(dragItem){dragItem.curX=cx;dragItem.curY=cy;}return canvasInvOpen;}
function invHandleUp(cx,cy){
    if(!canvasInvOpen)return false;
    if(!dragItem)return true;
    const d=dragItem;dragItem=null;
    if(Math.hypot(cx-d.startX,cy-d.startY)<=12)return true;
    const s=d.slot;
    // Check if dropped on a hand slot
    const hSlots=window._invHandSlots||[];
    for(const hs of hSlots){
        if(cx>=hs.x&&cx<=hs.x+hs.w&&cy>=hs.y&&cy<=hs.y+hs.h){
            const validWeapons=['sword','bow','gun','grenade','pickaxe'];
            if(s.type==='weapon'&&validWeapons.includes(s.key.replace('has','').toLowerCase())){
                const wMode=s.key.replace('has','').toLowerCase();
                if(ownedWeapons.has(wMode)){
                    if(hs.slotIdx===0){if(player.handSlot2===wMode)player.handSlot2=null;player.handSlot1=wMode;}
                    else{if(player.handSlot1===wMode)player.handSlot1=null;player.handSlot2=wMode;}
                    if(d.source==='hand'&&d.slotIdx!==hs.slotIdx){if(d.slotIdx===0)player.handSlot1=null;else player.handSlot2=null;}
                    if(!player.activeWeaponMode||d.source==='hand'){const m=hs.slotIdx===0?player.handSlot1:player.handSlot2;if(m)equipWeapon(m);}
                    updateSwitchBtn();
                }
            }
            return true;
        }
    }
    // From hand slot, dropped outside panel — unequip & drop to world
    if(d.source==='hand'){
        if(isInsideInvPanel(cx,cy))return true;
        if(d.slotIdx===0)player.handSlot1=null;else player.handSlot2=null;
        _syncActiveWeapon();
        updateSwitchBtn();_dropToWorld(s);closeInventory();return true;
    }
    // Dropped outside panel — remove item & drop to world
    if(!isInsideInvPanel(cx,cy)){
        if(s.type==='resource'){resources[s.key]=0;updateResources();}
        else if(s.type==='chips'){player.chipsCount=0;updateFoodBtn();}
        else{
            player[s.key]=false;const wMode=s.key.replace('has','').toLowerCase();ownedWeapons.delete(wMode);
            if(player.handSlot1===wMode)player.handSlot1=null;if(player.handSlot2===wMode)player.handSlot2=null;
            _syncActiveWeapon();
        }
        _dropToWorld(s);closeInventory();return true;
    }
    // Dropped on item slot — assign to hand slot
    const slots2=getInvSlots();
    for(let i=0;i<slots2.length;i++){const r=getSlotRect(i,invLayout);if(cx>=r.x&&cx<=r.x+r.w&&cy>=r.y&&cy<=r.y+r.h){
        if(s.type==='weapon'&&s.key!=='hasArmor'){const wMode=s.key.replace('has','').toLowerCase();if(ownedWeapons.has(wMode))_autoAssignHandSlot(wMode);}
        return true;
    }}
    return true;
}
function _dropToWorld(s){
    const DROP_DIST=55,rawWx=player.x+Math.cos(player.facing)*DROP_DIST,rawWy=player.y+Math.sin(player.facing)*DROP_DIST;
    const wx=Math.round(rawWx/TILE_SIZE)*TILE_SIZE,wy=Math.round(rawWy/TILE_SIZE)*TILE_SIZE;
    if(isOnGridWorld(wx,wy)){worldItems.push({id:wItemId++,x:wx,y:wy,key:s.key,icon:s.icon,name:s.name,type:s.type,qty:s.qty,bob:0,cooldown:90,world:currentWorld});playTone({type:'sine',freq:480,freq2:560,duration:0.12,volume:0.2,attack:0.01,decay:0.04,sustain:0.4,release:0.04});}
    else{playTone({type:'sine',freq:100,freq2:40,duration:0.5,volume:0.3,attack:0.01,decay:0.1,sustain:0.2,release:0.2});}
}

function _syncActiveWeapon(){

function startDuel(){

    cpuProjectiles.length=0;projectiles.length=0;grenades.length=0;monsters.length=0;

    // CPU corner barriers:    bottom (y=-1, x=4..7) + left (x=4, y=-4..-2)
    [[-7,1],[-6,1],[-5,1],[-4,1],[-4,2],[-4,3],[-4,4],
     [7,-1],[6,-1],[5,-1],[4,-1],[4,-2],[4,-3],[4,-4]].forEach(([_gx,_gy])=>{
        const _k=_gx+','+_gy;
        duelBarrierKeys.add(_k);
        grid.set(_k,_wc);
        if(worlds.arena)worlds.arena.set(_k,_wc);
    });
    for(let i=placedChests.length-1;i>=0;i--){if(placedChests[i].isDuelChest)placedChests.splice(i,1);}
    // Move torches that overlap with chest positions to nearest corner of that tile
    const chestTiles=[{gx:-6,gy:3},{gx:6,gy:-3}];
    for(const ct of chestTiles){
        for(const t of placedTorches){
            if(t.world==='arena'&&t.gx===ct.gx&&t.gy===ct.gy){
                // Move to nearest corner (diagonally away from center 0,0)
                const cx=-ct.gx>0?ct.gx-1:ct.gx+1; // shift x away from center
                const cy=-ct.gy>0?ct.gy-1:ct.gy+1; // shift y away from center
                t.gx=cx;t.gy=cy;t.x=cx*TILE_SIZE;t.y=cy*TILE_SIZE;
                lightMapDirty=true;
            }
        }
    }
    placedChests.push({gx:-6,gy:3,x:-360,y:180,world:'arena',isDuelChest:true,items:getRandomDuelChestItems(3)});
    placedChests.push({gx:6,gy:-3,x:360,y:-180,world:'arena',isDuelChest:true,items:getRandomDuelChestItems(3)});
    duelPrepPhase=true;duelPrepTimer=DUEL_PREP_DURATION;
    SFX.duelStart();showNotification('Sandiktan esya al! 8sn sonra savas!');setDuelUIMode(true);
}

function handleGridPlacement(e){
    if(!gridPlacementMode||!pendingGridPlacement)return;
    const cx=e.touches?e.touches[0].clientX:e.clientX,cy=e.touches?e.touches[0].clientY:e.clientY;
    const gx=Math.round((cx+camera.x)/TILE_SIZE),gy=Math.round((cy+camera.y)/TILE_SIZE),key=`${gx},${gy}`;
    const existing=grid.get(key),hasNeighbor=grid.has(`${gx+1},${gy}`)||grid.has(`${gx-1},${gy}`)||grid.has(`${gx},${gy+1}`)||grid.has(`${gx},${gy-1}`);
    if(!existing&&!hasNeighbor){showNotification('❌ Mevcut bir platforma bitişik olmalı!');return;}
    if(placementType==='chest'){
        if(!existing){showNotification('❌ Sandık mevcut bir grid tile üzerine yerleştirilmeli!');return;}
        if(existing.type==='chest'||existing.isWall){showNotification('❌ Bu tile zaten dolu!');return;}
        if(placedChests.some(c=>c.gx===gx&&c.gy===gy&&c.world===currentWorld)){showNotification('❌ Bu tile zaten dolu!');return;}
        placedChests.push({gx,gy,x:gx*TILE_SIZE,y:gy*TILE_SIZE,world:currentWorld,items:new Array(CHEST_SLOTS).fill(undefined)});
        gridPlacementMode=false;pendingGridPlacement=false;placementType='normal';
        document.getElementById('grid-placement-info').style.display='none';SFX.gridPlace();showNotification('🎁 Sandık yerleştirildi!');return;
    }
    if(placementType==='torch'){
        if(!existing){showNotification('❌ Meşale mevcut bir grid tile üzerine yerleştirilmeli!');return;}
        if(placedTorches.some(t=>t.gx===gx&&t.gy===gy&&t.world===currentWorld)){showNotification('❌ Bu tile zaten dolu!');return;}
        placedTorches.push({gx,gy,x:gx*TILE_SIZE,y:gy*TILE_SIZE,world:currentWorld});
        lightMapDirty=true;
        gridPlacementMode=false;pendingGridPlacement=false;placementType='normal';
        document.getElementById('grid-placement-info').style.display='none';SFX.gridPlace();showNotification('🔥 Meşale yerleştirildi!');return;
    }
    if(existing){showNotification('❌ Bu tile zaten dolu!');return;}
    grid.set(key,placementType==='energy'?{color:'#facc15',type:'energy',isWall:false}:placementType==='arena_wall'?{color:'#2e1065',type:'arena_wall',isWall:true}:{color:'#2a3140',type:'normal',isWall:false});
    gridPlacementMode=false;pendingGridPlacement=false;
    const placedMsg=placementType==='arena_wall'?'🟪 Duvar yerleştirildi!':'✅ Grid yerleştirildi!';
    placementType='normal';
    document.getElementById('grid-placement-info').style.display='none';SFX.gridPlace();showNotification(placedMsg);
}

function isOverButton(x,y){
    for(const id of['jump-btn','craft-btn','close-craft','menu-btn','close-world-select']){const el=document.getElementById(id);if(!el)continue;const r=el.getBoundingClientRect();if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return true;}
    if(document.getElementById('crafting-overlay').classList.contains('active'))return true;
    if(document.getElementById('world-select-overlay').classList.contains('active'))return true;
    if(document.getElementById('inventory-overlay').classList.contains('active'))return true;
    return false;
}

function getPovJoyCenter(){return{x:POV_JOY_X,y:window.innerHeight-110};}
function isInPovJoyZone(x,y){const c=getPovJoyCenter(),dx=x-c.x,dy=y-c.y;return Math.sqrt(dx*dx+dy*dy)<JOY_MAX_RADIUS+60;}
function updateJoyStickVisual(){const sx=joystick.dx*JOY_MAX_RADIUS,sy=joystick.dy*JOY_MAX_RADIUS;joyStick.style.transform=`translate(calc(-50% + ${sx}px), calc(50% + ${sy}px))`;}

function handleInputStart(e){
    if(document.getElementById('crafting-overlay').classList.contains('active'))return;
    if(document.getElementById('world-select-overlay').classList.contains('active'))return;
    if(e.type==='touchstart')e.preventDefault();
    const points=e.changedTouches?Array.from(e.changedTouches):[e];
    for(const pt of points){
        const{clientX,clientY}=pt,touchId=pt.identifier!==undefined?pt.identifier:'mouse';
        if(chestInvOpen){chestInvHandleDown(clientX,clientY);return;}
        if(canvasInvOpen){invHandleDown(clientX,clientY);return;}
        if(gridPlacementMode&&pendingGridPlacement){handleGridPlacement(e);return;}
        if(isOverButton(clientX,clientY))continue;
        if(!joystick.active&&isInPovJoyZone(clientX,clientY)){joystick.active=true;joystick.touchId=touchId;joystick.originX=getPovJoyCenter().x;joystick.originY=getPovJoyCenter().y;joystick.dx=0;joystick.dy=0;updateJoyStickVisual();}
    }
}
function handleInputMove(e){
    const anyOpen=document.getElementById('crafting-overlay').classList.contains('active')||document.getElementById('world-select-overlay').classList.contains('active');
    if(chestInvOpen){if(e.type==='touchmove')e.preventDefault();const pt=e.touches?e.touches[0]:e;chestInvHandleMove(pt.clientX,pt.clientY);return;}
    if(canvasInvOpen){if(e.type==='touchmove')e.preventDefault();const pt=e.touches?e.touches[0]:e;invHandleMove(pt.clientX,pt.clientY);return;}
    if(e.type==='touchmove'&&!anyOpen)e.preventDefault();
    const pts=e.touches?Array.from(e.touches):[e];
    for(const pt of pts){
        if(joystick.active&&joystick.touchId===(pt.identifier!==undefined?pt.identifier:'mouse')){
            let dx=pt.clientX-joystick.originX,dy=pt.clientY-joystick.originY,dist=Math.sqrt(dx*dx+dy*dy);
            if(dist>JOY_MAX_RADIUS){dx=(dx/dist)*JOY_MAX_RADIUS;dy=(dy/dist)*JOY_MAX_RADIUS;}
            joystick.dx=dx/JOY_MAX_RADIUS;joystick.dy=dy/JOY_MAX_RADIUS;updateJoyStickVisual();
        }
    }
}
function handleInputEnd(e){
    if(chestInvOpen){const pt=e.changedTouches?e.changedTouches[0]:e;chestInvHandleUp(pt.clientX,pt.clientY);return;}
    if(canvasInvOpen){const pt=e.changedTouches?e.changedTouches[0]:e;invHandleUp(pt.clientX,pt.clientY);return;}
    const ids=e.changedTouches?Array.from(e.changedTouches).map(t=>t.identifier):['mouse'];
    if(ids.includes(joystick.touchId)){joystick.active=false;joystick.dx=0;joystick.dy=0;joystick.touchId=null;updateJoyStickVisual();}
}

const projectiles=[],grenades=[],grenadeExplosions=[];

function throwGrenade(){
    if(!player.hasGrenade)return;if(!player.grenadeCooldown)player.grenadeCooldown=0;if(player.grenadeCooldown>0)return;
    player.grenadeCooldown=30;SFX.grenadeThrow();
    grenades.push({x:player.x+Math.cos(player.facing)*16,y:player.y+Math.sin(player.facing)*16,vx:Math.cos(player.facing)*3,vy:Math.sin(player.facing)*3,z:10,vz:4,timer:90,fromPlayer:true});
}

function fireGun(){
    if(!player.hasGun)return;
    if(player.gunReloading){return;}
    if(player.gunCooldown>0)return;
    if(player.gunAmmo<=0){reloadGun();return;}
    player.gunAmmo--;player.gunCooldown=12;SFX.gunShoot();
    // Bullet spread for fun
    const spread=(Math.random()-0.5)*0.08;
    const ang=player.facing+spread;
    projectiles.push({x:player.x+Math.cos(ang)*16,y:player.y+Math.sin(ang)*16,vx:Math.cos(ang)*14,vy:Math.sin(ang)*14,life:50,damage:18,fromPlayer:true,isGun:true,spawnX:player.x,spawnY:player.y});
    if(player.gunAmmo===0){setTimeout(()=>{if(player.hasGun&&player.gunAmmo===0&&!player.gunReloading)reloadGun();},300);}
}

function reloadGun(){
    if(!player.hasGun||player.gunReloading||player.gunAmmo===player.gunMaxAmmo)return;
    player.gunReloading=true;player.gunReloadTimer=player.gunReloadDuration;SFX.gunReload();
}

function explodeGrenade(g){
    SFX.grenadeExplode();const RADIUS=110;
    grenadeExplosions.push({x:g.x,y:g.y,r:5,maxR:RADIUS,life:25,maxLife:25});
    if(duelActive){
        for(const{ent,isCpu}of[{ent:cpu,isCpu:true},{ent:player,isCpu:false}]){
            const dx=ent.x-g.x,dy=ent.y-g.y,dist=Math.sqrt(dx*dx+dy*dy);
            if(dist<RADIUS&&ent.z<30){
                const falloff=1-dist/RADIUS,baseDmg=Math.round(60*falloff),dmg=ent.hasArmor?Math.round(baseDmg*0.6):baseDmg;
                if(isCpu){cpu.health=Math.max(0,cpu.health-dmg);cpu.hitFlash=10;spawnFloatingText('-'+dmg,cpu.x,cpu.y-20);const d2=dist||1;cpu.knockbackX=(dx/d2)*35*falloff;cpu.knockbackY=(dy/d2)*35*falloff;cpu.knockbackFrames=1;if(cpu.health<=0){cpu.isDead=true;endDuel(true);return;}}
                else{player.health=Math.max(0,player.health-dmg);spawnFloatingText('-'+dmg,player.x,player.y-20);SFX.playerHurt();if(player.health<=0)endDuel(false);}
            }
        }
    }else{
        for(let i=monsters.length-1;i>=0;i--){const m=monsters[i],dx=m.x-g.x,dy=m.y-g.y,dist=Math.sqrt(dx*dx+dy*dy);if(dist<RADIUS){const falloff=1-dist/RADIUS;m.hp-=Math.round(65*falloff);m.hitFlash=10;if(m.hp<=0){resources.darkMatter+=1;updateResources();SFX.collect();monsters.splice(i,1);}}}
    }
}

function startBowCharge(){if(player.isDead)return;if(player.hasBow&&player.bowCooldown<=0&&!player.bowCharging){player.bowCharging=true;player.bowCharge=0;SFX.bowDraw();}}

function getActiveWeapon(){
    const mode=player.activeWeaponMode;
    if(mode==='bow'&&player.hasBow)return'bow';if(mode==='sword'&&player.hasSword)return'sword';
    if(mode==='pickaxe'&&player.hasPickaxe)return'pickaxe';if(mode==='grenade'&&player.hasGrenade)return'grenade';
    if(mode==='gun'&&player.hasGun)return'gun';
    if(!mode){if(player.hasSword)return'sword';if(player.hasBow)return'bow';if(player.hasPickaxe)return'pickaxe';if(player.hasGrenade)return'grenade';if(player.hasGun)return'gun';}
    return null;
}

function interact(){
    if(player.isDead)return;
    if(player.isEating)return; // can't attack while eating
    if(currentWorld==='game'||currentWorld==='arena'){const ci=placedChests.findIndex(c=>c.world===currentWorld&&Math.hypot(player.x-c.x,player.y-c.y)<48);if(ci>=0){openChestUI(ci);return;}}
    if(currentWorld==='mine'){if(Math.sqrt(player.x*player.x+player.y*player.y)<120){SFX.worldSwitch();switchWorld('lobby');showNotification('🏠 Lobiye döndün');return;}}
    if(currentWorld==='lobby'){
        if(Math.sqrt((player.x-npc.x)**2+(player.y-npc.y)**2)<90){startDuel();return;}
    }
    if(currentWorld==='mine'&&getActiveWeapon()==='pickaxe'&&player.attackCooldown<=0){player.attackTimer=20;player.attackCooldown=25;SFX.swordSwing();return;}
    const mode=getActiveWeapon();
    if(mode==='bow'){startBowCharge();return;}
    if(mode==='sword'&&player.attackCooldown<=0){player.attackTimer=18;player.attackCooldown=55;SFX.swordSwing();swordHit(player,duelActive?[cpu]:monsters,12,22);}
    if(mode==='grenade')throwGrenade();
    if(mode==='gun')fireGun();
}

function mineOre(){
    let closest=null,closestDist=100;
    for(const ore of oreNodes){if(ore.depleted)continue;const d=Math.sqrt((ore.x-player.x)**2+(ore.y-player.y)**2);if(d<closestDist){closestDist=d;closest=ore;}}
    if(!closest)return;
    const oreType=ORE_TYPES.find(t=>t.id===closest.type);
    closest.hp-=10;closest.hitFlash=10;spawnFloatingText('-10',closest.x,closest.y-20);SFX.swordHitSound();
    if(closest.hp<=0){const gained=oreType.amount();resources[oreType.resource]=(resources[oreType.resource]||0)+gained;updateResources();SFX.collect();showNotification(`${oreType.icon} +${gained} ${oreType.id==='stone'?'Taş':oreType.id==='iron'?'Demir':'Altın'}`);closest.depleted=true;closest.respawnTimer=600;}
}

function pointToSegmentDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,lenSq=dx*dx+dy*dy;if(lenSq===0)return Math.hypot(px-ax,py-ay);const t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/lenSq));return Math.hypot(px-(ax+t*dx),py-(ay+t*dy));}

function swordHit(attacker,targets,damage,kbForce){
    const r2=attacker.size/2,handleLen=r2*0.6+11,bladeLen=30,SWING_HALF=1.1;
    for(let i=targets.length-1;i>=0;i--){
        const t=targets[i];
        const targetOnGround=(t===cpu)?(cpu.z<=0):(t.wasOnGround!==false&&(t.z||0)<=0);
        if(!targetOnGround)continue;
        let hit=false;const hitRadius=(t.size||28)/2+6;
        for(let s=0;s<=6;s++){const frac=s/6,bladeAngle=attacker.facing+(-SWING_HALF+frac*SWING_HALF*2);const bx1=attacker.x+Math.cos(bladeAngle)*handleLen,by1=attacker.y+Math.sin(bladeAngle)*handleLen,bx2=attacker.x+Math.cos(bladeAngle)*(handleLen+bladeLen),by2=attacker.y+Math.sin(bladeAngle)*(handleLen+bladeLen);if(pointToSegmentDist(t.x,t.y,bx1,by1,bx2,by2)<=hitRadius){hit=true;break;}}
        if(!hit)continue;
        const finalDmg=t.hasArmor?Math.round(damage*0.6):damage;t.hitFlash=10;SFX.swordHitSound();
        const dx=t.x-attacker.x,dy2=t.y-attacker.y,d=Math.hypot(dx,dy2)||1;
        t.knockbackX=(dx/d)*kbForce;t.knockbackY=(dy2/d)*kbForce;t.knockbackFrames=10;
        spawnFloatingText(`-${finalDmg}`,t.x,t.y-20);
        if(duelActive&&t===cpu){cpu.health=Math.max(0,cpu.health-finalDmg);if(cpu.health<=0){cpu.isDead=true;endDuel(true);return;}}
        else if(!duelActive){t.hp=Math.max(0,(t.hp||30)-finalDmg);if(t.hp<=0){resources.darkMatter+=1;updateResources();SFX.collect();monsters.splice(i,1);}}
    }
}

const npc={x:-2*60,y:-3*60,size:26,bobOffset:0,facing:0,dialogueLines:['⚔️ Düelloya hazır mısın?','🛡️ Kapıya yaklaş, dövüş!','💰 Silahını iyi seç...','🏹 Rakibini iyi tanı!','✨ Güç sende, savaşçı!'],currentLine:0,lineTimer:0,lineDuration:200,showBubble:false,bubbleTimer:0};
let npcProximityShown=false,monsterRespawnTimer=0;
const MONSTER_RESPAWN_INTERVAL=300,MAX_LOBBY_MONSTERS=12;
const LOBBY_SPAWN_POINTS=[[8,0],[-8,0],[0,8],[0,-8],[14,0],[-14,0],[0,14],[0,-14],[14,14],[-14,-14],[14,-14],[-14,14],[19,3],[-19,-3],[3,19],[-3,-19]];
function trySpawnMonster(){
    if(currentWorld!=='lobby'||monsters.length>=MAX_LOBBY_MONSTERS)return;
    const far=LOBBY_SPAWN_POINTS.filter(([gx,gy])=>Math.sqrt((player.x-gx*TILE_SIZE)**2+(player.y-gy*TILE_SIZE)**2)>250);
    if(!far.length)return;
    const[gx,gy]=far[Math.floor(Math.random()*far.length)];
    monsters.push({id:monsterIdCounter++,x:gx*TILE_SIZE,y:gy*TILE_SIZE,hp:30,maxHp:30,speed:1.2+Math.random()*0.4,aggroRange:320,attackRange:22,attackCooldown:0,hitFlash:0,size:18,knockbackX:0,knockbackY:0,knockbackFrames:0});
}

function respawn(){if(duelActive){endDuel(false);return;}player.isDead=true;resources.darkMatter+=1;updateResources();const savedE=player.energy;setTimeout(()=>{player.x=0;player.y=0;player.z=100;player.vz=0;player.energy=savedE;player.health=player.maxHealth;player.isDead=false;},800);}

function updateCpu(){
    if(!duelActive||cpu.isDead)return;
    if(duelPrepPhase){
        // During prep: CPU walks to its chest and picks up items
        const cpuChest=placedChests.find(c=>c.isDuelChest&&c.world==='arena'&&c.gx===6&&c.gy===-3);
        if(cpuChest){
            const dx=cpuChest.x-cpu.x,dy=cpuChest.y-cpu.y,dist=Math.sqrt(dx*dx+dy*dy);
            if(dist>40){
                cpu.facing=Math.atan2(dy,dx);
                const nx=cpu.x+Math.cos(cpu.facing)*cpu.baseSpeed*0.7;
                const ny=cpu.y+Math.sin(cpu.facing)*cpu.baseSpeed*0.7;
                // Only move if not entering a wall
                const ngx=Math.round(nx/TILE_SIZE),ngy=Math.round(ny/TILE_SIZE);
                const ncell=grid.get(`${ngx},${ngy}`);
                if(ncell&&!ncell.isWall){cpu.x=nx;cpu.y=ny;}
            } else {
                // Pick up all items from chest
                for(let i=0;i<cpuChest.items.length;i++){
                    const item=cpuChest.items[i];if(!item)continue;
                    if(item.type==='weapon'){cpu[item.key]=true;if(item.key==='hasGun'){cpu.gunAmmo=7;cpu.gunMaxAmmo=7;}}
                    else if(item.type==='chips'){cpu.chipsCount=(cpu.chipsCount||0)+item.qty;}
                    cpuChest.items[i]=undefined;
                }
                // Update CPU internal weapon state
                cpu._hasSword=cpu.hasSword;cpu._hasBow=cpu.hasBow;
                if(cpu._hasSword&&!cpu._hasBow){cpu.usingBow=false;}
                else if(cpu._hasBow&&!cpu._hasSword){cpu.usingBow=true;}
                else if(cpu._hasSword&&cpu._hasBow){cpu.hasBow=false;cpu.usingBow=false;}
            }
        }
        return;
    }
    if(cpu.hitFlash>0)cpu.hitFlash--;
    if(!cpu.kbVx)cpu.kbVx=0;if(!cpu.kbVy)cpu.kbVy=0;
    cpu.kbVx*=0.82;cpu.kbVy*=0.82;
    if(cpu.knockbackFrames>0){cpu.kbVx=cpu.knockbackX;cpu.kbVy=cpu.knockbackY;cpu.knockbackFrames=0;}
    cpu.x+=cpu.kbVx;cpu.y+=cpu.kbVy;
    if(cpu.attackCooldown>0)cpu.attackCooldown--;if(cpu.bowCooldown>0)cpu.bowCooldown--;if(cpu.attackTimer>0)cpu.attackTimer--;
    if(!cpu.weaponSwitchCooldown)cpu.weaponSwitchCooldown=0;if(cpu.weaponSwitchCooldown>0)cpu.weaponSwitchCooldown--;

    // --- Eating logic: eat chips when low health ---
    if(!cpu.isEating)cpu.isEating=false;
    if(!cpu.eatingTimer)cpu.eatingTimer=0;
    if(cpu.isEating){
        cpu.eatingTimer--;
        if(cpu.eatingTimer<=0){
            cpu.isEating=false;
            if(cpu.eatingItem&&cpu.eatingItem.heal){
                cpu.health=Math.min(cpu.maxHealth,cpu.health+cpu.eatingItem.heal);
                spawnFloatingText(`+${cpu.eatingItem.heal}❤️`,cpu.x,cpu.y-30);
            }
            cpu.eatingItem=null;
        }
    } else if(cpu.chipsCount>0&&cpu.health<cpu.maxHealth*0.65){
        // High chance per frame so CPU eats within ~10 frames of going below threshold
        if(Math.random()<0.15){
            cpu.chipsCount--;
            cpu.isEating=true;
            cpu.eatingTimer=60;
            cpu.eatingItem={icon:'🍟',heal:Math.round(cpu.maxHealth/6)};
            SFX.eat();
        }
    }

    const dx=player.x-cpu.x,dy=player.y-cpu.y,dist=Math.sqrt(dx*dx+dy*dy);
    cpu.facing=Math.atan2(dy,dx);
    if(cpu.weaponSwitchCooldown<=0){
        if(cpu._hasBow&&cpu._hasSword){if(dist>90&&!cpu.usingBow){cpu.hasBow=true;cpu.hasSword=false;cpu.usingBow=true;cpu.weaponSwitchCooldown=60;}else if(dist<=90&&cpu.usingBow){cpu.hasBow=false;cpu.hasSword=true;cpu.usingBow=false;cpu.weaponSwitchCooldown=60;}}
        else if(cpu._hasBow&&!cpu._hasSword){cpu.hasBow=true;cpu.hasSword=false;cpu.usingBow=true;}
        else if(cpu._hasSword&&!cpu._hasBow){cpu.hasBow=false;cpu.hasSword=true;cpu.usingBow=false;}
    }
    const targetDist=cpu.hasBow?170:70;
    if(!cpu.isEating){
        if(dist>targetDist){cpu.x+=Math.cos(cpu.facing)*cpu.baseSpeed*0.5;cpu.y+=Math.sin(cpu.facing)*cpu.baseSpeed*0.5;}
        else if(cpu.hasBow&&dist<110){cpu.x-=Math.cos(cpu.facing)*cpu.baseSpeed*0.35;cpu.y-=Math.sin(cpu.facing)*cpu.baseSpeed*0.35;}
    }
    const arenaMaxX=7*TILE_SIZE+TILE_SIZE/2,arenaMaxY=4*TILE_SIZE+TILE_SIZE/2,cr=cpu.size/2;
    if(cpu.x>arenaMaxX-cr){cpu.x=arenaMaxX-cr;cpu.kbVx=0;}if(cpu.x<-arenaMaxX+cr){cpu.x=-arenaMaxX+cr;cpu.kbVx=0;}
    if(cpu.y>arenaMaxY-cr){cpu.y=arenaMaxY-cr;cpu.kbVy=0;}if(cpu.y<-arenaMaxY+cr){cpu.y=-arenaMaxY+cr;cpu.kbVy=0;}

    if(!cpu.isEating){
        const cpuMisses=Math.random()<0.35;
        // --- Gun: worse accuracy, longer cooldown, misses more ---
        if(cpu.hasGun&&!cpu.hasBow&&!cpu.hasSword){
            if(!cpu.gunCooldown)cpu.gunCooldown=0;if(cpu.gunCooldown>0)cpu.gunCooldown--;
            if(cpu.gunCooldown<=0&&dist<260&&dist>60&&Math.random()<0.6){
                const spread=(Math.random()-0.5)*0.7,aimAngle=cpu.facing+spread;
                cpuProjectiles.push({x:cpu.x+Math.cos(aimAngle)*14,y:cpu.y+Math.sin(aimAngle)*14,vx:Math.cos(aimAngle)*11,vy:Math.sin(aimAngle)*11,life:55,damage:12});
                cpu.gunCooldown=45+Math.floor(Math.random()*20);
            }
        }
        // --- Bow: charge to a random target amount (10-45), not always full ---
        if(cpu.hasBow&&cpu.bowCooldown<=0&&dist<280&&dist>80){
            if(!cpu.bowCharging){
                cpu.bowCharging=true;
                cpu.bowCharge=0;
                // Pick a random charge target: short(10-20), medium(20-35), full(35-45)
                const roll=Math.random();
                cpu._bowTarget=roll<0.35?10+Math.random()*10:roll<0.7?20+Math.random()*15:35+Math.random()*10;
                SFX.bowDraw();
            }
        }
        if(cpu.bowCharging){
            cpu.bowCharge=(cpu.bowCharge||0)+1;
            const target=cpu._bowTarget||45;
            if(cpu.bowCharge>=target){
                // release
                cpu.bowCharging=false;
                const charge=cpu.bowCharge/45;
                const spread=(Math.random()-0.5)*0.45,aimAngle=cpu.facing+spread;
                cpuProjectiles.push({x:cpu.x+Math.cos(aimAngle)*14,y:cpu.y+Math.sin(aimAngle)*14,vx:Math.cos(aimAngle)*(5+charge*10),vy:Math.sin(aimAngle)*(5+charge*10),life:60+Math.round(charge*60),damage:6+Math.round(charge*24),isBow:true,spawnX:cpu.x,spawnY:cpu.y});
                cpu.bowCharge=0;cpu._bowTarget=0;cpu.bowCooldown=75+Math.floor(Math.random()*40);SFX.bowShoot();
            } else if(dist>310||dist<65){
                // cancel charge if out of range
                cpu.bowCharging=false;cpu.bowCharge=0;cpu._bowTarget=0;
            }
        }
        if(cpu.hasSword&&cpu.attackCooldown<=0&&dist<72){cpu.attackTimer=18;cpu.attackCooldown=80;const finalDmg=hasArmorActive()?4:7;if(!cpuMisses&&Math.abs(Math.atan2(dy,dx)-cpu.facing)<Math.PI*0.45){player.health=Math.max(0,player.health-finalDmg);SFX.swordHitSound();SFX.playerHurt();player.knockbackX=dx/dist*18;player.knockbackY=dy/dist*18;player.knockbackFrames=8;spawnFloatingText(`-${finalDmg}`,player.x,player.y-20);if(player.health<=0)endDuel(false);}}
    }

    if(!cpu.jumpCooldown)cpu.jumpCooldown=0;if(cpu.jumpCooldown>0)cpu.jumpCooldown--;
    if(cpu.z<=0&&cpu.jumpCooldown<=0&&Math.random()<0.008){cpu.vz=8;cpu.jumpCooldown=120+Math.floor(Math.random()*120);}
    cpu.vz-=0.4;cpu.z+=cpu.vz;
    // Ground detection: same logic as player (hypot overlap, wider tolerance)
    const cgX=Math.round(cpu.x/TILE_SIZE),cgY=Math.round(cpu.y/TILE_SIZE);
    const cpuHalfTile=TILE_SIZE/2,cpuR=cpu.size*0.45;
    let cpuGround=-Infinity,cpuOnGrid=false;
    for(let ddx=-2;ddx<=2;ddx++)for(let ddy=-2;ddy<=2;ddy++){
        const cell=grid.get(`${cgX+ddx},${cgY+ddy}`);if(!cell||cell.isWall)continue;
        const gx2=(cgX+ddx)*TILE_SIZE,gy2=(cgY+ddy)*TILE_SIZE;
        const ox=Math.max(0,Math.abs(cpu.x-gx2)-cpuHalfTile),oy=Math.max(0,Math.abs(cpu.y-gy2)-cpuHalfTile);
        if(Math.hypot(ox,oy)<cpuR){if(0>cpuGround)cpuGround=0;cpuOnGrid=true;}
    }
    if(cpu.z<=cpuGround&&cpu.vz<=0&&cpuOnGrid){cpu.z=cpuGround;cpu.vz=0;}else if(cpu.z<-120)endDuel(true);
}

function update(){
    if(duelActive&&duelPrepPhase){duelPrepTimer--;if(duelPrepTimer<=0){duelPrepPhase=false;const _nc={color:'#2a3140',type:'normal',isWall:false};for(const k of duelBarrierKeys){grid.set(k,_nc);if(worlds.arena)worlds.arena.set(k,_nc);}duelBarrierKeys.clear();closeChestUI();}}
    if(player.isDead)return;
    document.getElementById('coords-display').textContent=`(${Math.round(player.x/TILE_SIZE)}, ${-Math.round(player.y/TILE_SIZE)})`;
    if(currentWorld==='lobby'){player.energy=player.maxEnergy;document.getElementById('bars-container').style.display='none';}
    else{
        document.getElementById('bars-container').style.display='';
        const moveLen2=Math.sqrt((joystick.dx+(keys.d?1:0)-(keys.a?1:0))**2+(joystick.dy+(keys.s?1:0)-(keys.w?1:0))**2);
        const ns=Math.min(1,moveLen2);
        if(ns>0.05)player.energy=Math.max(0,player.energy-(0.003+ns*ns*0.025));
        else player.energy=Math.min(player.maxEnergy,player.energy+0.05);
    }
    document.getElementById('energyBar').style.height=(player.energy/player.maxEnergy*100)+'%';
    if(player.attackTimer>0)player.attackTimer--;if(player.attackCooldown>0)player.attackCooldown--;if(player.bowCooldown>0)player.bowCooldown--;
    if(player.gunCooldown>0)player.gunCooldown--;
    if(player.gunReloading){player.gunReloadTimer--;if(player.gunReloadTimer<=0){player.gunReloading=false;player.gunAmmo=player.gunMaxAmmo;SFX.craft();}}

    for(let i=projectiles.length-1;i>=0;i--){
        const p=projectiles[i];p.x+=p.vx;p.y+=p.vy;p.life--;if(p.life<=0){projectiles.splice(i,1);continue;}
        // Wall collision check
        const pgx=Math.round(p.x/TILE_SIZE),pgy=Math.round(p.y/TILE_SIZE);
        const pcell=grid.get(`${pgx},${pgy}`);
        if(pcell&&pcell.isWall){projectiles.splice(i,1);continue;}
        if(!pcell){projectiles.splice(i,1);continue;}
        if(duelActive&&p.fromPlayer){const dx=cpu.x-p.x,dy=cpu.y-p.y;if(Math.sqrt(dx*dx+dy*dy)<cpu.size/2+5){let pdmg=p.damage;if(p.isGun&&p.spawnX!==undefined){const travelDist=Math.hypot(p.x-p.spawnX,p.y-p.spawnY);if(travelDist<80){pdmg=Math.round(pdmg*(0.35+travelDist/80*0.65));}}else if(p.isBow&&p.spawnX!==undefined){const travelDist=Math.hypot(p.x-p.spawnX,p.y-p.spawnY);if(travelDist<60){pdmg=Math.round(pdmg*(0.4+travelDist/60*0.6));}}const dmg=cpu.hasArmor?Math.round(pdmg*0.6):pdmg;cpu.health=Math.max(0,cpu.health-dmg);cpu.hitFlash=8;spawnFloatingText(`-${dmg}`,cpu.x,cpu.y-20);SFX.arrowHit();projectiles.splice(i,1);if(cpu.health<=0){cpu.isDead=true;endDuel(true);}}}
        else if(!duelActive){let hit=false;for(let j=monsters.length-1;j>=0;j--){const m=monsters[j],dx=m.x-p.x,dy=m.y-p.y;if(Math.sqrt(dx*dx+dy*dy)<m.size/2+5){let pdmg=p.damage;if(p.isGun&&p.spawnX!==undefined){const travelDist=Math.hypot(p.x-p.spawnX,p.y-p.spawnY);if(travelDist<80){pdmg=Math.round(pdmg*(0.35+travelDist/80*0.65));}}else if(p.isBow&&p.spawnX!==undefined){const travelDist=Math.hypot(p.x-p.spawnX,p.y-p.spawnY);if(travelDist<60){pdmg=Math.round(pdmg*(0.4+travelDist/60*0.6));}}m.hp-=pdmg;m.hitFlash=8;const d=Math.sqrt(dx*dx+dy*dy)||1;m.knockbackX=(dx/d)*30;m.knockbackY=(dy/d)*30;m.knockbackFrames=6;if(m.hp<=0){resources.darkMatter+=1;updateResources();SFX.collect();monsters.splice(j,1);}hit=true;break;}}if(hit)projectiles.splice(i,1);}
    }
    for(let i=cpuProjectiles.length-1;i>=0;i--){
        const p=cpuProjectiles[i];p.x+=p.vx;p.y+=p.vy;p.life--;if(p.life<=0){cpuProjectiles.splice(i,1);continue;}
        // Wall collision check
        const cpgx=Math.round(p.x/TILE_SIZE),cpgy=Math.round(p.y/TILE_SIZE);
        const cpcell=grid.get(`${cpgx},${cpgy}`);
        if(cpcell&&cpcell.isWall){cpuProjectiles.splice(i,1);continue;}
        if(!cpcell){cpuProjectiles.splice(i,1);continue;}
        const dx=player.x-p.x,dy=player.y-p.y;
        if(Math.sqrt(dx*dx+dy*dy)<player.size/2+5){if(!player.wasOnGround)continue;const dmg=hasArmorActive()?Math.round(p.damage*0.6):p.damage;player.health=Math.max(0,player.health-dmg);spawnFloatingText(`-${dmg}`,player.x,player.y-20);SFX.playerHurt();cpuProjectiles.splice(i,1);if(player.health<=0)endDuel(false);}
    }
    for(let i=floatingTexts.length-1;i>=0;i--){floatingTexts[i].life--;floatingTexts[i].y-=0.5;if(floatingTexts[i].life<=0)floatingTexts.splice(i,1);}
    if(!player.grenadeCooldown)player.grenadeCooldown=0;if(player.grenadeCooldown>0)player.grenadeCooldown--;
    for(let i=grenades.length-1;i>=0;i--){
        const g=grenades[i];g.vz-=0.35;g.z+=g.vz;g.x+=g.vx;g.y+=g.vy;
        if(duelActive){const amx=7*TILE_SIZE+TILE_SIZE/2-6,amy=4*TILE_SIZE+TILE_SIZE/2-6;if(g.x>amx){g.x=amx;g.vx=-Math.abs(g.vx)*0.5;}if(g.x<-amx){g.x=-amx;g.vx=Math.abs(g.vx)*0.5;}if(g.y>amy){g.y=amy;g.vy=-Math.abs(g.vy)*0.5;}if(g.y<-amy){g.y=-amy;g.vy=Math.abs(g.vy)*0.5;}}
        if(g.z<=0){g.z=0;if(Math.abs(g.vz)>1){g.vz=-g.vz*0.45;g.vx*=0.7;g.vy*=0.7;}else{g.vz=0;g.vx*=0.6;g.vy*=0.6;}}
        g.timer--;if(g.timer<=0){explodeGrenade(g);grenades.splice(i,1);}
    }
    for(let i=grenadeExplosions.length-1;i>=0;i--){const ex=grenadeExplosions[i];ex.life--;ex.r=ex.maxR*Math.min(1,(1-ex.life/ex.maxLife)*1.3);if(ex.life<=0)grenadeExplosions.splice(i,1);}

    if(player.bowCharging&&player.hasBow){
        const prev=player.bowCharge;player.bowCharge=Math.min(player.bowMaxCharge,player.bowCharge+1);
        const charged=player.bowCharge/player.bowMaxCharge;
        if(Math.floor(prev/8)<Math.floor(player.bowCharge/8)){playTone({type:'triangle',freq:200+charged*600,freq2:(200+charged*600)*0.85,duration:0.08,volume:0.08+charged*0.1,attack:0.003,decay:0.03,sustain:0.3,release:0.03});playNoise({duration:0.06,volume:0.05+charged*0.08,freq:800+charged*1200,q:3});}
    }

    let moveX=joystick.dx+(keys.d?1:0)-(keys.a?1:0),moveY=joystick.dy+(keys.s?1:0)-(keys.w?1:0);
    const mLen=Math.sqrt(moveX*moveX+moveY*moveY);if(mLen>1){moveX/=mLen;moveY/=mLen;}
    if(moveX!==0||moveY!==0)player.facing=Math.atan2(moveY,moveX);
    // Eating mode timer
    if(player.isEating){
        player.eatingTimer--;
        if(player.eatingTimer<=0){
            const item=player.eatingItem;
            player.isEating=false;player.eatingTimer=0;player.eatingItem=null;
            if(item&&item.heal){
                player.health=Math.min(player.maxHealth,player.health+item.heal);
                spawnFloatingText(`+${item.heal}❤️`,player.x,player.y-30);
                SFX.eatDone();
            }
            updateFoodBtn();
        }
    }
    const eatSlow=player.isEating?0.3:1.0;
    const bowDrawSlow=(player.bowCharging&&player.hasBow)?0.2:1.0,spd=player.baseSpeed*(0.2+0.8*(player.energy/player.maxEnergy))*bowDrawSlow*eatSlow;
    if(!player.kbVx)player.kbVx=0;if(!player.kbVy)player.kbVy=0;
    player.kbVx*=0.82;player.kbVy*=0.82;
    if(player.knockbackFrames>0){player.kbVx=player.knockbackX;player.kbVy=player.knockbackY;player.knockbackFrames=0;}
    const preX=player.x,preY=player.y;
    player.x+=player.kbVx+moveX*spd;player.y+=player.kbVy+moveY*spd;

    if(currentWorld==='lobby'){
        for(const npcEnt of[npc]){const ndr=npcEnt.size/2+player.size/2,ndx=player.x-npcEnt.x,ndy=player.y-npcEnt.y,nd=Math.sqrt(ndx*ndx+ndy*ndy);if(nd<ndr&&nd>0.01){const ov=ndr-nd;player.x+=(ndx/nd)*ov;player.y+=(ndy/nd)*ov;}}
    }
    // Wall collision (arena_wall tiles block lateral movement)
    {
        const pr=player.size/2,wGridX=Math.round(player.x/TILE_SIZE),wGridY=Math.round(player.y/TILE_SIZE);
        for(let ddx=-2;ddx<=2;ddx++)for(let ddy=-2;ddy<=2;ddy++){
            const cell=grid.get(`${wGridX+ddx},${wGridY+ddy}`);if(!cell||!cell.isWall)continue;
            const wx=(wGridX+ddx)*TILE_SIZE,wy=(wGridY+ddy)*TILE_SIZE,half=TILE_SIZE/2+pr;
            const dx=player.x-wx,dy=player.y-wy;
            if(Math.abs(dx)<half&&Math.abs(dy)<half){
                if(Math.abs(dx)>Math.abs(dy)){player.x=wx+(dx>0?half:-half);player.kbVx=0;}
                else{player.y=wy+(dy>0?half:-half);player.kbVy=0;}
            }
        }
    }
    for(const c of placedChests){
        if(c.world!==currentWorld)continue;
        const chestHalf=18+player.size/2; // match visual S=18
        const dx=player.x-c.x,dy=player.y-c.y;
        if(Math.abs(dx)<chestHalf&&Math.abs(dy)<chestHalf){
            if(Math.abs(dx)>Math.abs(dy)){player.x=c.x+(dx>0?chestHalf:-chestHalf);}
            else{player.y=c.y+(dy>0?chestHalf:-chestHalf);}
        }
    }
    if(duelActive&&!cpu.isDead&&!player.isDead){
        const cdx=player.x-cpu.x,cdy=player.y-cpu.y,cdist=Math.sqrt(cdx*cdx+cdy*cdy),minDist=(player.size+cpu.size)/2;
        if(cdist<minDist&&cdist>0.01){const overlap=minDist-cdist,nx=cdx/cdist,ny=cdy/cdist;player.x+=nx*overlap*0.5;player.y+=ny*overlap*0.5;cpu.x-=nx*overlap*0.5;cpu.y-=ny*overlap*0.5;}
    }
    if(duelActive){const amx=7*TILE_SIZE+TILE_SIZE/2,amy=4*TILE_SIZE+TILE_SIZE/2,pr=player.size/2;if(player.x>amx-pr){player.x=amx-pr;player.kbVx=0;}if(player.x<-amx+pr){player.x=-amx+pr;player.kbVx=0;}if(player.y>amy-pr){player.y=amy-pr;player.kbVy=0;}if(player.y<-amy+pr){player.y=-amy+pr;player.kbVy=0;}}

    // ── KENARLIK: platformdan düşmeyi engelle (game + lobby) ─────────────────
    if((currentWorld==='game'||currentWorld==='lobby')&&player.wasOnGround&&player.z<=2){
        const playerOverGrid=(px,py)=>{
            const gx2=Math.round(px/TILE_SIZE),gy2=Math.round(py/TILE_SIZE),hr=TILE_SIZE/2,pr2=player.size*0.38;
            for(let ddx=-2;ddx<=2;ddx++)for(let ddy=-2;ddy<=2;ddy++){
                const cell=grid.get(`${gx2+ddx},${gy2+ddy}`);if(!cell||cell.isWall)continue;
                const tx=(gx2+ddx)*TILE_SIZE,ty=(gy2+ddy)*TILE_SIZE;
                const ox=Math.max(0,Math.abs(px-tx)-hr),oy=Math.max(0,Math.abs(py-ty)-hr);

            else{player.x=preX;player.y=preY;player.kbVx=0;player.kbVy=0;}

    }
    // ─────────────────────────────────────────────────────────────────────────
    if(currentWorld==='mine'){

        if(player.z<28){
            for(const ore of oreNodes){if(ore.depleted)continue;const ot=ORE_TYPES.find(t=>t.id===ore.type),oR=ot.size+4,pr2=player.size/2,minDist=oR+pr2,odx=player.x-ore.x,ody=player.y-ore.y,odist=Math.sqrt(odx*odx+ody*ody);
                if(odist<minDist&&odist>0.01){const overlap=minDist-odist,nx=odx/odist,ny=ody/odist;player.x+=nx*overlap;player.y+=ny*overlap;const vdn=(player.kbVx||0)*nx+(player.kbVy||0)*ny;if(vdn<0){player.kbVx=(player.kbVx||0)-vdn*nx;player.kbVy=(player.kbVy||0)-vdn*ny;}}}
        }
    }

    if(!duelActive){
        const egx=Math.round(player.x/TILE_SIZE),egy=Math.round(player.y/TILE_SIZE),egCell=grid.get(`${egx},${egy}`);
        if(egCell&&player.wasOnGround){
            if(egCell.type==='energy'&&player.health>0.15){player.health=Math.max(0,player.health-0.15);player.energy=Math.min(player.maxEnergy,player.energy+0.20);}
            else if(egCell.type==='health_drain'&&player.energy>0.12){player.energy=Math.max(0,player.energy-0.12);player.health=Math.min(player.maxHealth,player.health+0.18);}
        }
    }
    if(!duelActive){
        for(const m of monsters){
            if(m.hitFlash>0)m.hitFlash--;if(!m.kbVx)m.kbVx=0;if(!m.kbVy)m.kbVy=0;m.kbVx*=0.80;m.kbVy*=0.80;
            if(m.knockbackFrames>0){m.kbVx=m.knockbackX;m.kbVy=m.knockbackY;m.knockbackFrames=0;}m.x+=m.kbVx;m.y+=m.kbVy;

        }
    }
    if(currentWorld==='mine'){for(const ore of oreNodes){if(ore.hitFlash>0)ore.hitFlash--;if(ore.depleted){ore.respawnTimer--;if(ore.respawnTimer<=0){const ot=ORE_TYPES.find(t=>t.id===ore.type);ore.hp=ot.hp;ore.depleted=false;ore.hitFlash=0;}}}}

    if(npc.lineTimer>=npc.lineDuration){npc.lineTimer=0;npc.currentLine=(npc.currentLine+1)%npc.dialogueLines.length;}
    if(currentWorld==='lobby'){
        npc.showBubble=Math.sqrt((player.x-npc.x)**2+(player.y-npc.y)**2)<200;
        elementMaster.showBubble=false;
    }else{npc.showBubble=false;elementMaster.showBubble=false;}
    updateCpu();updateInteractBtn();

    player.vz-=0.4;player.z+=player.vz;
    const gridX=Math.round(player.x/TILE_SIZE),gridY=Math.round(player.y/TILE_SIZE),halfTile=TILE_SIZE/2,playerR=player.size*0.45;
    let groundZ=-Infinity,onAnyGrid=false;
    for(let dx2=-1;dx2<=1;dx2++)for(let dy2=-1;dy2<=1;dy2++){const cell=grid.get(`${gridX+dx2},${gridY+dy2}`);if(!cell||cell.isWall)continue;const gx2=(gridX+dx2)*TILE_SIZE,gy2=(gridY+dy2)*TILE_SIZE;const ox=Math.max(0,Math.abs(player.x-gx2)-halfTile),oy=Math.max(0,Math.abs(player.y-gy2)-halfTile);if(Math.hypot(ox,oy)<playerR){if(0>groundZ)groundZ=0;onAnyGrid=true;}}

    else{player.wasOnGround=false;if(player.z<-150){if(currentWorld==='mine'){player.x=0;player.y=0;player.z=100;player.vz=0;}else respawn();}}
    camera.x=player.x-canvas.width/2;camera.y=player.y-canvas.height/2;
}

function openWorldSelect(){
    if(duelActive)return;
    const c=document.getElementById('world-options-container');c.innerHTML='';
    [{id:'game',name:'World',desc:'Kendi dünyan — grid ekleyebilirsin.'},{id:'lobby',name:'Lobi',desc:'Sabit harita — arena kapısından düelloya gir.'}].forEach(w=>{
        const div=document.createElement('div');div.className='world-option'+(currentWorld===w.id?' active':'');
        div.innerHTML=`<div class="world-name">${w.name}</div><div class="world-desc">${w.desc}</div>`;

// ═══════════════════════════════════════════════════════════════════════════
// MULTIPLAYER KATMANI
// ═══════════════════════════════════════════════════════════════════════════
const otherPlayers = new Map(); // id → state
let myId = null;
let ws = null;
let wsConnected = false;
let playerName = localStorage.getItem('aeroPlayerName') || `Oyuncu${Math.floor(Math.random()*999)}`;

// ── Bağlantı ────────────────────────────────────────────────────────────────
function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const url = `${proto}://${location.host}`;
    ws = new WebSocket(url);

    ws.onopen = () => {
        wsConnected = true;
        document.getElementById('mp-status').textContent = '🟢 Bağlı';
        ws.send(JSON.stringify({ type: 'SET_NAME', name: playerName }));
        console.log('[MP] Sunucuya bağlandı');
    };

    ws.onclose = () => {
        wsConnected = false;
        document.getElementById('mp-status').textContent = '🔴 Bağlantı kesildi';
        otherPlayers.clear();
        setTimeout(connectWS, 3000); // yeniden bağlan
    };

    ws.onerror = () => {
        document.getElementById('mp-status').textContent = '🔴 Hata';
    };

    ws.onmessage = (evt) => {
        let msg;
        try { msg = JSON.parse(evt.data); } catch { return; }
        handleServerMsg(msg);
    };
}

function wsSend(msg) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
}

// ── Server mesajları ────────────────────────────────────────────────────────
function handleServerMsg(msg) {
    switch (msg.type) {

        case 'INIT': {
            myId = msg.id;
            // Grid'i sunucudan al
            grid.clear();
            for (const [k, v] of Object.entries(msg.grid)) grid.set(k, v);
            // Dünya grid'ini de güncelle
            worlds.game.clear();
            for (const [k, v] of Object.entries(msg.grid)) worlds.game.set(k, v);
            lightMapDirty = true;
            // Sandıkları yükle
            placedChests.length = 0;
            for (const chest of Object.values(msg.chests)) placedChests.push(chest);
            // Dünya eşyaları
            worldItems.length = 0;
            for (const item of Object.values(msg.worldItems)) worldItems.push(item);
            // Diğer oyuncular
            for (const p of msg.players) otherPlayers.set(p.id, p);
            showNotification(`🌐 ID: ${myId} | ${otherPlayers.size} oyuncu çevrimiçi`);
            break;
        }

        case 'PLAYER_JOIN': {
            otherPlayers.set(msg.player.id, msg.player);
            showNotification(`👤 ${msg.player.name} katıldı`);
            break;
        }

        case 'PLAYER_LEAVE': {
            const p = otherPlayers.get(msg.id);
            if (p) showNotification(`👋 ${p.name} ayrıldı`);
            otherPlayers.delete(msg.id);
            break;
        }

        case 'PLAYER_UPDATE': {
            if (msg.id === myId) break;
            const existing = otherPlayers.get(msg.id) || {};
            otherPlayers.set(msg.id, { ...existing, ...msg });
            break;
        }

        case 'PLAYER_NAME': {
            const p = otherPlayers.get(msg.id);
            if (p) p.name = msg.name;
            break;
        }

        case 'GRID_SET': {
            const key = `${msg.gx},${msg.gy}`;
            if (msg.cell === null) { grid.delete(key); worlds.game.delete(key); }
            else { grid.set(key, msg.cell); worlds.game.set(key, msg.cell); }
            lightMapDirty = true;
            break;
        }

        case 'CHEST_ADD': {
            placedChests.push(msg.chest);
            break;
        }

        case 'CHEST_UPDATE': {
            const c = placedChests.find(c => c.id === msg.id);
            if (c) c.items = msg.items;
            break;
        }

        case 'PROJECTILE': {
            if (msg.fromId === myId) break;
            // Başka oyuncudan gelen mermi/ok — düşmana sayılır
            projectiles.push({
                x: msg.x, y: msg.y, vx: msg.vx, vy: msg.vy,
                life: msg.life || 60, damage: msg.damage || 10,
                fromPlayer: false, fromRemote: true, remoteId: msg.fromId,
                isGun: msg.isGun, isBow: msg.isBow,
                spawnX: msg.x, spawnY: msg.y,
            });
            break;
        }

        case 'GRENADE': {
            if (msg.fromId === myId) break;
            grenades.push({
                x: msg.x, y: msg.y, z: msg.z,
                vx: msg.vx, vy: msg.vy, vz: msg.vz,
                timer: msg.timer || 120,
                fromRemote: true, remoteId: msg.fromId,
            });
            break;
        }

        case 'EXPLOSION': {
            grenadeExplosions.push({ x: msg.x, y: msg.y, r: 0, maxR: msg.r, life: 30, maxLife: 30 });
            // Hasar kontrolü kendi player'ına
            const edx = player.x - msg.x, edy = player.y - msg.y;
            const ed = Math.sqrt(edx*edx + edy*edy);
            if (ed < msg.r && player.wasOnGround && !player.isDead) {
                const falloff = 1 - ed/msg.r;
                const dmg = Math.round(60 * falloff * (hasArmorActive() ? 0.6 : 1));
                player.health = Math.max(0, player.health - dmg);
                spawnFloatingText(`-${dmg}`, player.x, player.y-20);
                SFX.playerHurt();
                if (player.health <= 0) respawn();
            }
            break;
        }

        case 'HIT': {
            // Sunucu doğruladı: biz vurulduk
            player.health = Math.max(0, player.health - msg.amount);
            spawnFloatingText(`-${msg.amount}`, player.x, player.y-20);
            SFX.playerHurt();
            if (player.health <= 0) respawn();
            break;
        }

        case 'WORLD_ITEM_ADD': {
            worldItems.push(msg.item);
            break;
        }

        case 'WORLD_ITEM_REMOVE': {
            const idx = worldItems.findIndex(i => i.id === msg.id);
            if (idx >= 0) worldItems.splice(idx, 1);
            break;
        }

        case 'TORCH_ADD': {
            placedTorches.push({ gx: msg.gx, gy: msg.gy, x: msg.x, y: msg.y, world: msg.world });
            lightMapDirty = true;
            break;
        }

        case 'CHAT': {
            showChatMessage(msg.name, msg.text);
            break;
        }
    }
}

// ── Grid değişimini sync et ──────────────────────────────────────────────────
const _origGridSet = grid.set.bind(grid);
grid.set = function(key, val) {
    _origGridSet(key, val);

};
const _origGridDelete = grid.delete.bind(grid);
grid.delete = function(key) {

        const [gx, gy] = key.split(',').map(Number);
        wsSend({ type: 'GRID_SET', gx, gy, cell: null });
    }
};

    grid.set(key, val);
